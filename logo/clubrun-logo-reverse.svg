<svg style="background:#0E2A47" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 475 160" role="img" aria-label="ClubRun">
  <title>ClubRun</title>
  <!-- Mark: a "C" built from two running-track lanes, with a forward stride flash -->
  <g transform="translate(80 80)">
    <circle r="70" fill="#FF5A1F"/>
    <path d="M 31 -38 A 49 49 0 1 0 31 38" fill="none" stroke="#0E2A47" stroke-width="11" stroke-linecap="round"/>
    <path d="M 18 -22 A 29 29 0 1 0 18 22" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>
    <path d="M 14 0 L 52 0 M 38 -13 L 54 0 L 38 13" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Wordmark -->
  <text x="170" y="103" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="72" font-weight="800" font-style="italic" letter-spacing="-2">
    <tspan fill="#FFFFFF">Club</tspan><tspan fill="#FF5A1F">Run</tspan>
  </text>
</svg>
