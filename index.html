<!--
  dashboard.html — DISPLAY LAYER

  Reads ONLY computed_data.json. Never reads garmin_data.json or
  manual_log.json directly, and never recalculates anything.
  If a number here is wrong, the bug is in build_computed.py, not here.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coaching Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #F7F7F5;
    --surface: #FFFFFF;
    --border: #E5E5E3;
    --text-primary: #1A1A1A;
    --text-secondary: #4A4A4A;
    --text-muted: #6B7280;
    --yellow: #F5C518;
    --yellow-text: #A88400;
    --blue: #2C6CB0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 1.5rem;
  }
  .header { margin-bottom: 1.25rem; }
  .header .eyebrow { font-size: 13px; color: var(--text-muted); margin: 0; }
  .header h1 { font-size: 22px; font-weight: 500; margin: 4px 0 0; }
  .header .sub { font-size: 13px; color: var(--text-secondary); margin: 2px 0 0; }

  .summary-strip {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    margin: 1.25rem 0;
    font-size: 14px;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .summary-strip .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--yellow); flex-shrink: 0;
  }

  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 1.5rem;
  }
  .card {
    background: var(--surface);
    border-radius: 8px;
    padding: 1rem;
    border: 1px solid var(--border);
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .card .label { font-size: 13px; color: var(--text-muted); margin: 0 0 4px; }
  .card .value { font-size: 24px; font-weight: 500; margin: 0; }
  .card .delta { font-size: 12px; margin: 4px 0 0; }
  .delta.up { color: var(--yellow-text); }
  .delta.down { color: var(--blue); }
  .delta.flat { color: var(--text-muted); }

  .chart-card {
    background: var(--surface);
    border-radius: 12px;
    padding: 1rem;
    margin-bottom: 1rem;
    border: 1px solid var(--border);
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .chart-card .title { font-size: 13px; color: var(--text-muted); margin: 0 0 12px; }
  .chart-wrap { position: relative; height: 220px; }

  .error {
    background: #FDF0F0;
    border: 1px solid #E5A0A0;
    color: #A83232;
    padding: 1rem;
    border-radius: 8px;
    font-size: 14px;
  }

  .tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 1.25rem;
  }
  .tab-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 14px;
    padding: 8px 14px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  .tab-btn.active {
    color: var(--text-primary);
    border-bottom-color: var(--blue);
  }
  .tab-panel { display: none; }
</style>
</head>
<body>

  <div class="header">
    <p class="eyebrow">Garmin + Open-Meteo</p>
    <h1>Coaching dashboard</h1>
    <p class="sub" id="dateLabel">Loading...</p>
  </div>

  <div style="display:flex; gap:16px; margin-bottom:1.25rem;">
    <a href="manual_log_editor.html" style="font-size:13px; color:var(--blue); text-decoration:none;">Edit session log</a>
    <a href="training_plan_editor.html" style="font-size:13px; color:var(--blue); text-decoration:none;">Edit training plan</a>
    <a href="races_editor.html" style="font-size:13px; color:var(--blue); text-decoration:none;">Edit race results</a>
  </div>

  <div class="tabs" style="flex-wrap:wrap;">
    <button class="tab-btn active" data-tab="overview">Overview</button>
    <button class="tab-btn" data-tab="coach">Coach</button>
    <button class="tab-btn" data-tab="acwr">ACWR</button>
    <button class="tab-btn" data-tab="plan">Plan</button>
    <button class="tab-btn" data-tab="performance">Performance</button>
    <button class="tab-btn" data-tab="predictor">Predictor</button>
    <button class="tab-btn" data-tab="races">Races</button>
  </div>

  <div id="content">
    <p class="error" style="display:none;" id="errorBox"></p>
  </div>

  <div id="tab-coach" class="tab-panel" style="display:none;"></div>
  <div id="tab-acwr" class="tab-panel" style="display:none;"></div>
  <div id="tab-plan" class="tab-panel" style="display:none;"></div>
  <div id="tab-performance" class="tab-panel" style="display:none;"></div>
  <div id="tab-predictor" class="tab-panel" style="display:none;"></div>
  <div id="tab-races" class="tab-panel" style="display:none;"></div>

<script>
// If the Chart.js CDN is unreachable (offline PWA, network blip), stub
// it out so cards, tables and the coach review still render — losing
// the charts must never blank the whole dashboard.
if (typeof Chart === 'undefined') window.Chart = class { constructor() {} };

// Fill-in URL of the "Weekly review response" Google Form — powers the
// Respond button on the Coach tab. See AUTOMATION_SETUP.md step 2.
const REVIEW_FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSelVvuccMxIiMpIy9vjmGPHJjjV4mwHOB4ReQH0uel8d2PGcA/viewform';

async function loadDashboard() {
  const content = document.getElementById('content');
  const errorBox = document.getElementById('errorBox');

  let data;
  try {
    const res = await fetch('computed_data.json?v=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    data = await res.json();
  } catch (err) {
    errorBox.style.display = 'block';
    errorBox.textContent = 'Could not load computed_data.json: ' + err.message;
    return;
  }

  if (!Array.isArray(data) || data.length === 0) {
    errorBox.style.display = 'block';
    errorBox.textContent = 'computed_data.json loaded but contained no rows.';
    return;
  }

  data.sort((a, b) => a.date.localeCompare(b.date));
  const today = data[data.length - 1];

  document.getElementById('dateLabel').textContent = today.date;

  function deltaClass(delta) {
    if (delta === null || delta === undefined) return 'flat';
    if (delta > 0.5) return 'up';
    if (delta < -0.5) return 'down';
    return 'flat';
  }
  function fmtDelta(delta, unit) {
    if (delta === null || delta === undefined) return '';
    const sign = delta > 0 ? '+' : '';
    return `${sign}${delta}${unit} vs 7d avg`;
  }

  content.innerHTML = `
    <div class="summary-strip">
      <span class="dot"></span>
      <span>${today.today_summary || 'No summary available.'}</span>
    </div>

    <div class="card-grid">
      <div class="card">
        <p class="label">RHR</p>
        <p class="value">${today.rhr ?? '--'}</p>
        <p class="delta ${deltaClass(today.rhr_delta_from_baseline)}">${fmtDelta(today.rhr_delta_from_baseline, ' bpm')}</p>
      </div>
      <div class="card">
        <p class="label">HRV</p>
        <p class="value">${today.hrv_last_night ?? '--'}</p>
        <p class="delta ${deltaClass(today.hrv_delta_from_baseline)}">${fmtDelta(today.hrv_delta_from_baseline, ' ms')}</p>
      </div>
      <div class="card">
        <p class="label">Sleep score</p>
        <p class="value">${today.sleep_score ?? '--'}</p>
      </div>
      <div class="card">
        <p class="label">Body battery</p>
        <p class="value">${today.body_battery_high ?? '--'}</p>
      </div>
      <div class="card">
        <p class="label">ACWR</p>
        <p class="value">${today.acwr ?? '--'}</p>
      </div>
      <div class="card">
        <p class="label">Heat risk today</p>
        <p class="value" style="text-transform:capitalize;">${today.heat_risk ?? 'n/a'}</p>
      </div>
    </div>

    <div class="chart-card">
      <p class="title">HRV &amp; RHR trend</p>
      <div class="chart-wrap"><canvas id="hrvRhrChart"></canvas></div>
    </div>

    <div class="chart-card">
      <p class="title">Sleep score &amp; body battery</p>
      <div class="chart-wrap"><canvas id="sleepBbChart"></canvas></div>
    </div>

    <div class="chart-card">
      <p class="title">Achilles score (0 = no issue, 10 = severe)</p>
      <div class="chart-wrap"><canvas id="achillesChart"></canvas></div>
    </div>

    <div class="chart-card" id="planCard" style="display:none;">
      <p class="title">Upcoming sessions</p>
      <table style="width:100%; border-collapse:collapse; font-size:13px;">
        <thead>
          <tr style="text-align:left; color:var(--text-muted);">
            <th style="padding:6px 8px;">Date</th><th style="padding:6px 8px;">Type</th>
            <th style="padding:6px 8px;">Distance</th><th style="padding:6px 8px;">Pace</th>
          </tr>
        </thead>
        <tbody id="planRows"></tbody>
      </table>
    </div>
  `;

  const labels = data.map(r => r.date.slice(5));

  new Chart(document.getElementById('hrvRhrChart'), {
    type: 'line',
    data: {
      labels,
      datasets: [
        {
          label: 'HRV (ms)',
          data: data.map(r => r.hrv_last_night),
          borderColor: '#D4A800',
          backgroundColor: '#D4A800',
          tension: 0.3,
          spanGaps: true,
        },
        {
          label: 'RHR (bpm)',
          data: data.map(r => r.rhr),
          borderColor: '#2C6CB0',
          backgroundColor: '#2C6CB0',
          tension: 0.3,
          spanGaps: true,
          yAxisID: 'y1',
        },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        y: { position: 'left', ticks: { color: '#6B7280' }, grid: { color: '#E5E5E3' } },
        y1: { position: 'right', ticks: { color: '#6B7280' }, grid: { display: false } },
        x: { ticks: { color: '#6B7280' }, grid: { color: '#E5E5E3' } },
      },
      plugins: { legend: { labels: { color: '#1A1A1A' } } },
    },
  });

  new Chart(document.getElementById('sleepBbChart'), {
    type: 'line',
    data: {
      labels,
      datasets: [
        {
          label: 'Sleep score',
          data: data.map(r => r.sleep_score),
          borderColor: '#2C6CB0',
          backgroundColor: '#2C6CB0',
          tension: 0.3,
          spanGaps: true,
        },
        {
          label: 'Body battery',
          data: data.map(r => r.body_battery_high),
          borderColor: '#D4A800',
          backgroundColor: '#D4A800',
          tension: 0.3,
          spanGaps: true,
        },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        y: { ticks: { color: '#6B7280' }, grid: { color: '#E5E5E3' } },
        x: { ticks: { color: '#6B7280' }, grid: { color: '#E5E5E3' } },
      },
      plugins: { legend: { labels: { color: '#1A1A1A' } } },
    },
  });

  new Chart(document.getElementById('achillesChart'), {
    type: 'line',
    data: {
      labels,
      datasets: [
        {
          label: 'Achilles (0-10)',
          data: data.map(r => r.achilles_score),
          borderColor: '#D4A800',
          backgroundColor: '#D4A800',
          tension: 0.2,
          spanGaps: true,
          pointRadius: 4,
        },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        y: {
          min: 0, max: 10,
          ticks: { color: '#6B7280', stepSize: 1 },
          grid: { color: '#E5E5E3' },
        },
        x: { ticks: { color: '#6B7280' }, grid: { color: '#E5E5E3' } },
      },
      plugins: {
        legend: { display: false },
        annotation: undefined,
      },
    },
  });

  setupTabs(data);
  return data;
}

function setupTabs(data) {
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.style.display = 'none');
      document.getElementById('content').style.display = 'none';

      btn.classList.add('active');
      const tab = btn.dataset.tab;
      if (tab === 'overview') {
        document.getElementById('content').style.display = 'block';
      } else {
        document.getElementById('tab-' + tab).style.display = 'block';
      }
    });
  });

  buildCoachTab();
  buildAcwrTab(data);
  buildPlanTab(data);
  buildPerformanceTab(data);
  buildPredictorTab();
  buildRacesTab();
}

// Minimal markdown renderer for the weekly review — headings, bold,
// bullets, paragraphs. Content is coach-authored, but escape anyway.
function renderMd(md) {
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  return esc(md).split(/\n{2,}/).map(block => {
    const lines = block.split('\n');
    if (lines.every(l => /^\s*[-*] /.test(l))) {
      return '<ul style="margin:8px 0; padding-left:20px;">' +
        lines.map(l => `<li style="font-size:13px; color:var(--text-secondary); margin:3px 0;">${inline(l.replace(/^\s*[-*] /, ''))}</li>`).join('') +
        '</ul>';
    }
    const h = block.match(/^(#{1,4}) (.*)$/);
    if (h) return `<p style="font-size:14px; font-weight:600; margin:14px 0 4px;">${inline(h[2])}</p>`;
    return `<p style="font-size:13px; color:var(--text-secondary); margin:8px 0; line-height:1.5;">${inline(block.replace(/\n/g, '<br>'))}</p>`;
  }).join('');
  function inline(s) {
    return s.replace(/\*\*(.+?)\*\*/g, '<strong style="color:var(--text-primary);">$1</strong>');
  }
}

async function fetchJson(name) {
  try {
    const res = await fetch(name + '?v=' + Date.now());
    if (!res.ok) return null;
    return await res.json();
  } catch (e) { return null; }
}

async function buildCoachTab() {
  const panel = document.getElementById('tab-coach');
  const [review, proposal, weekly] = await Promise.all([
    fetchJson('weekly_review_latest.json'),
    fetchJson('plan_proposal.json'),
    fetchJson('weekly_summary.json'),
  ]);

  let html = '';

  // --- Road to race: the countdown panel every weekly decision hangs on ---
  const rr = weekly && weekly.race_readiness;
  if (rr) {
    const rem = rr.remaining_key_sessions || {};
    const longOk = rr.longest_run_recent_min != null && rr.longest_run_recent_min >= rr.long_run_target_min;
    html += `
      <div class="chart-card" style="border-left:3px solid var(--blue);">
        <p class="title">Road to ${rr.race.name}</p>
        <div class="card-grid" style="margin-bottom:0;">
          <div class="card" style="border:none; box-shadow:none; padding:0.5rem;">
            <p class="label">Countdown</p>
            <p class="value">${rr.race.days_away}<span style="font-size:14px; color:var(--text-muted);"> days</span></p>
            <p class="delta flat">${rr.weeks_to_race} weeks — ${rr.race.date}</p>
          </div>
          <div class="card" style="border:none; box-shadow:none; padding:0.5rem;">
            <p class="label">Goal</p>
            <p class="value" style="font-size:20px;">${rr.goal_time ? rr.goal_time.split('.')[0] : '--'}</p>
            <p class="delta flat">${rr.goal_pace ? rr.goal_pace + ' — current prediction' : ''}</p>
          </div>
          <div class="card" style="border:none; box-shadow:none; padding:0.5rem;">
            <p class="label">Taper begins</p>
            <p class="value" style="font-size:20px;">${rr.taper_start.slice(5)}</p>
            <p class="delta flat">last big load ends</p>
          </div>
          <div class="card" style="border:none; box-shadow:none; padding:0.5rem;">
            <p class="label">Longest run (4 wk)</p>
            <p class="value" style="font-size:20px;">${rr.longest_run_recent_min ?? '--'} min</p>
            <p class="delta ${longOk ? 'flat' : 'up'}">target ${rr.long_run_target_min}+ min before taper</p>
          </div>
        </div>
        <p style="font-size:13px; color:var(--text-secondary); margin:10px 0 0; border-top:1px solid var(--border); padding-top:10px;">
          Key sessions left in the plan before taper:
          <strong>${rem.tempo ?? 0}</strong> tempo · <strong>${rem.intervals ?? 0}</strong> intervals · <strong>${rem.long ?? 0}</strong> long
          <span style="color:var(--text-muted);">(as currently written — the plan extends each weekly review)</span>
        </p>
      </div>
    `;
  }

  // --- Latest weekly review ---
  if (review) {
    const recColor = review.recommendation === 'hold' ? '#2E7D32' : 'var(--yellow-text)';
    const recLabel = review.recommendation === 'hold' ? 'Hold the plan' : 'Change proposed';
    html += `
      <div class="chart-card">
        <p class="title">Weekly coach review — ${review.review_date}</p>
        <p style="font-size:15px; font-weight:500; margin:0 0 6px;">${review.headline || ''}</p>
        <p style="font-size:12px; font-weight:600; color:${recColor}; margin:0 0 10px; text-transform:uppercase; letter-spacing:0.03em;">${recLabel}</p>
        <div id="reviewBody" style="display:none; border-top:1px solid var(--border); padding-top:8px;">${renderMd(review.review_md || '')}</div>
        <button id="reviewToggle" style="background:none; border:none; color:var(--blue); font-size:13px; padding:0; cursor:pointer;">Read full review</button>
      </div>
    `;
  } else {
    html += `
      <div class="chart-card">
        <p class="title">Weekly coach review</p>
        <p style="font-size:13px; color:var(--text-muted); margin:0;">No review yet — the first one lands after the next Sunday-evening coach session.</p>
      </div>
    `;
  }

  // --- Pending proposal + respond button ---
  if (proposal && ['pending', 'amend_requested'].includes(proposal.status)) {
    const statusLabel = proposal.status === 'pending'
      ? 'Awaiting your response'
      : 'Amendment requested — coach will revise';
    html += `
      <div style="background:#FFF4E5; border:1px solid #F0C674; border-radius:8px; padding:12px 16px; margin-bottom:1rem;">
        <p style="font-size:13px; font-weight:600; color:#7A5200; margin:0 0 6px;">Plan proposal (${proposal.id}) — ${statusLabel}</p>
        <p style="font-size:13px; color:#7A5200; margin:0 0 10px;">${proposal.rationale || ''}</p>
        <table style="width:100%; border-collapse:collapse; font-size:12px; background:var(--surface); border-radius:6px;">
          <thead>
            <tr style="text-align:left; color:var(--text-muted);">
              <th style="padding:5px 8px;">Date</th><th style="padding:5px 8px;">Session</th>
              <th style="padding:5px 8px;">Dist</th><th style="padding:5px 8px;">Notes</th>
            </tr>
          </thead>
          <tbody>
            ${(proposal.changes || []).map(c => `
              <tr style="border-top:1px solid var(--border);">
                <td style="padding:5px 8px; white-space:nowrap;">${c.date.slice(5)}</td>
                <td style="padding:5px 8px; text-transform:capitalize;">${c.session_type === 'remove' ? '— remove —' : c.session_type}</td>
                <td style="padding:5px 8px;">${c.target_distance_km ? c.target_distance_km + ' km' : '--'}</td>
                <td style="padding:5px 8px; color:var(--text-secondary);">${c.notes || ''}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
        ${proposal.status === 'pending' ? (REVIEW_FORM_URL
          ? `<a href="${REVIEW_FORM_URL}" target="_blank" style="display:inline-block; margin-top:10px; background:var(--blue); color:#fff; font-size:13px; padding:8px 14px; border-radius:6px; text-decoration:none;">Respond (approve / amend / reject)</a>`
          : `<p style="font-size:12px; color:#7A5200; margin:10px 0 0;">Respond via the weekly review form (set REVIEW_FORM_URL in index.html to get a button here).</p>`) : ''}
      </div>
    `;
  } else if (proposal && proposal.status === 'applied') {
    html += `
      <div style="background:#EFF7EF; border:1px solid #A5C9A5; border-radius:8px; padding:10px 16px; margin-bottom:1rem;">
        <p style="font-size:13px; color:#2E7D32; margin:0;">Last proposal (${proposal.id}) approved and applied to the plan.</p>
      </div>
    `;
  }

  // --- Weekly stats ---
  if (weekly && weekly.weeks && weekly.weeks.length) {
    const weeks = weekly.weeks;
    html += `
      <div class="chart-card">
        <p class="title">Weekly training summary</p>
        <div style="overflow-x:auto;">
          <table style="width:100%; border-collapse:collapse; font-size:12px; min-width:560px;">
            <thead>
              <tr style="text-align:left; color:var(--text-muted);">
                <th style="padding:5px 8px;">Week</th><th style="padding:5px 8px;">km</th>
                <th style="padding:5px 8px;">Runs</th><th style="padding:5px 8px;">RPE</th>
                <th style="padding:5px 8px;" title="Minutes of tempo/interval/race running — the sessions that convert fitness into race performance">Qual</th>
                <th style="padding:5px 8px;" title="Share of running time at easy effort — should stay around 80%">Easy</th>
                <th style="padding:5px 8px;">On target</th><th style="padding:5px 8px;">HRV</th>
                <th style="padding:5px 8px;">RHR</th><th style="padding:5px 8px;">Sleep</th>
                <th style="padding:5px 8px;" title="Easy-run metres per minute per heartbeat — higher over time = aerobic fitness improving">Effcy</th>
              </tr>
            </thead>
            <tbody>
              ${[...weeks].reverse().map(w => `
                <tr style="border-top:1px solid var(--border);">
                  <td style="padding:5px 8px; white-space:nowrap;">${w.week_start.slice(5)}</td>
                  <td style="padding:5px 8px; font-weight:500;">${w.km ?? '--'}</td>
                  <td style="padding:5px 8px;">${w.runs ?? '--'}</td>
                  <td style="padding:5px 8px;">${w.avg_rpe ?? '--'}</td>
                  <td style="padding:5px 8px;">${w.quality_time_min || '--'}</td>
                  <td style="padding:5px 8px;">${w.easy_pct != null ? w.easy_pct + '%' : '--'}</td>
                  <td style="padding:5px 8px;">${w.on_target_pct != null ? w.on_target_pct + '%' : '--'}</td>

        <p class="title">Achilles score vs daily load — watch what provokes it</p>

      </div>

    // Current week's session log: watch data + your thoughts side by side
    const cur = weeks[weeks.length - 1];
    if (cur.session_log && cur.session_log.length) {
      html += `
        <div class="chart-card">
          <p class="title">This week's sessions</p>
          ${cur.session_log.map(s => `
            <div style="border-top:1px solid var(--border); padding:8px 0;">
              <p style="font-size:13px; margin:0;">

  panel.innerHTML = html;

  const toggle = document.getElementById('reviewToggle');
  if (toggle) {

  if (weekly && weekly.weeks && weekly.weeks.length && document.getElementById('weeklyKmChart')) {
    const weekLabels = weekly.weeks.map(w => w.week_start.slice(5));
    const axisOpts = {
      y: { ticks: { color: '#6B7280' }, grid: { color: '#E5E5E3' } },

    new Chart(document.getElementById('weeklyKmChart'), {

    const targetMin = weekly.race_readiness ? weekly.race_readiness.long_run_target_min : null;
    new Chart(document.getElementById('longRunChart'), {

function toDateStr(d) {
  // Always use LOCAL date components, never toISOString() — that
  // converts to UTC and silently shifts dates back a day whenever
  // the local timezone is ahead of UTC (e.g. UK on BST).
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function getWeekStart(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const day = d.getDay(); // 0=Sun, 1=Mon...
  const diff = day === 0 ? -6 : 1 - day; // shift to Monday
  d.setDate(d.getDate() + diff);
  return toDateStr(d);
}

function fmtWeekLabel(weekStartStr) {
  const start = new Date(weekStartStr + 'T00:00:00');
  const end = new Date(start);
  end.setDate(end.getDate() + 6);
  const fmt = d => d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  return `Week of ${fmt(start)} - ${fmt(end)}`;
}

async function buildPlanTab(computedData) {
  const panel = document.getElementById('tab-plan');
  const today = computedData[computedData.length - 1];

  let plan = [];
  let flagsLog = [];
  try {
    const res = await fetch('training_plan.json?v=' + Date.now());
    if (res.ok) plan = await res.json();
  } catch (e) { /* no plan yet */ }
  try {
    const res = await fetch('flags_log.json?v=' + Date.now());
    if (res.ok) flagsLog = await res.json();
  } catch (e) { /* no flags yet */ }

  const planByDate = {};
  plan.forEach(s => { planByDate[s.date] = s; });

  let html = '';

  if (today.plan_flag_reasons && today.plan_flag_reasons.length) {
    html += `
      <div style="background:#FFF4E5; border:1px solid #F0C674; border-radius:8px; padding:12px 16px; margin-bottom:1.5rem;">
        <p style="font-size:13px; font-weight:500; color:#7A5200; margin:0 0 6px;">Worth reviewing today</p>
        ${today.plan_flag_reasons.map(r => `<p style="font-size:13px; color:#7A5200; margin:2px 0;">• ${r}</p>`).join('')}
      </div>
    `;
  }

  // Build full 7-day weeks: this week + next 2 weeks, showing every day
  // (with or without a planned session), not just days that have entries.
  const todayWeekStart = getWeekStart(today.date);
  const weekStarts = [0, 1, 2].map(offset => {
    const d = new Date(todayWeekStart + 'T00:00:00');
    d.setDate(d.getDate() + offset * 7);
    return toDateStr(d);
  });

  weekStarts.forEach(weekStart => {
    const days = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(weekStart + 'T00:00:00');
      d.setDate(d.getDate() + i);
      days.push(toDateStr(d));
    }

    html += `
      <div class="chart-card">
        <p class="title">${fmtWeekLabel(weekStart)}</p>
        <table style="width:100%; border-collapse:collapse; font-size:13px;">
          <thead>
            <tr style="text-align:left; color:var(--text-muted);">
              <th style="padding:6px 8px;">Date</th><th style="padding:6px 8px;">Type</th>
              <th style="padding:6px 8px;">Distance</th><th style="padding:6px 8px;">Pace</th>
              <th style="padding:6px 8px;">Notes</th>
            </tr>
          </thead>
          <tbody>
            ${days.map(dateStr => {
              const s = planByDate[dateStr];
              const isToday = dateStr === today.date;
              const dayName = new Date(dateStr + 'T00:00:00').toLocaleDateString('en-GB', { weekday: 'short' });
              return `
                <tr style="border-top:1px solid var(--border); ${isToday ? 'background:#FFFBEF;' : ''}">
                  <td style="padding:6px 8px;">${dayName} ${dateStr.slice(5)}${isToday ? ' (today)' : ''}</td>
                  <td style="padding:6px 8px; text-transform:capitalize; ${!s ? 'color:var(--text-muted);' : ''}">${s ? s.session_type : 'Nothing planned'}</td>
                  <td style="padding:6px 8px;">${s && s.target_distance_km ? s.target_distance_km + ' km' : '--'}</td>
                  <td style="padding:6px 8px;">${s && s.target_pace ? s.target_pace : '--'}</td>
                  <td style="padding:6px 8px; color:var(--text-secondary);">${s && s.notes ? s.notes : ''}</td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      </div>
    `;
  });

  // Flag history — only past events, most recent first
  if (flagsLog.length) {
    const sorted = [...flagsLog].sort((a, b) => b.date.localeCompare(a.date));
    html += `
      <div class="chart-card">
        <p class="title">Flag history</p>
        <table style="width:100%; border-collapse:collapse; font-size:13px;">
          <thead>
            <tr style="text-align:left; color:var(--text-muted);">
              <th style="padding:6px 8px;">Date</th><th style="padding:6px 8px;">Planned</th><th style="padding:6px 8px;">Reasons</th>
            </tr>
          </thead>
          <tbody>
            ${sorted.map(f => `
              <tr style="border-top:1px solid var(--border);">
                <td style="padding:6px 8px;">${f.date}</td>
                <td style="padding:6px 8px; text-transform:capitalize;">${f.planned_session ?? '--'}</td>
                <td style="padding:6px 8px; color:var(--text-secondary);">${f.reasons.join(' ')}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  }

  panel.innerHTML = html;
}

async function buildPredictorTab() {
  const panel = document.getElementById('tab-predictor');
  let pred;
  try {
    const res = await fetch('race_prediction.json?v=' + Date.now());
    if (!res.ok) throw new Error('not found');
    pred = await res.json();
  } catch (e) {
    panel.innerHTML = '<p class="error">race_prediction.json not found — run race_predictor.py first.</p>';
    return;
  }

  const distances = ['5K', '10K', 'Half Marathon', 'Marathon'];

  let nextRaceHtml = '';
  if (pred.next_race && pred.next_race.date) {
    const daysToRace = Math.ceil((new Date(pred.next_race.date) - new Date(pred.generated_date)) / 86400000);
    nextRaceHtml = `
      <div class="card" style="margin-bottom:1.5rem;">
        <p class="label">Next race</p>
        <p class="value" style="font-size:18px;">${pred.next_race.name || 'Unnamed race'}</p>
        <p class="delta flat">${pred.next_race.date} — ${daysToRace} days away</p>
      </div>
    `;
  }

  const cardsHtml = distances.map(label => {
    const p = pred.predictions[label];
    if (!p || !p.predicted_time_fmt) {
      return `
        <div class="card">
          <p class="label">${label}</p>
          <p class="value" style="font-size:16px; color:var(--text-muted);">No data</p>
        </div>
      `;
    }
    return `
      <div class="card">
        <p class="label">${label}</p>
        <p class="value">${p.predicted_time_fmt}</p>
        <p class="delta flat">${p.low_estimate_fmt} - ${p.high_estimate_fmt}</p>
      </div>
    `;
  }).join('');

  const notesHtml = distances.map(label => {
    const p = pred.predictions[label];
    if (!p || !p.note) return '';
    return `<p style="font-size:12px; color:var(--text-secondary); margin:4px 0;"><strong>${label}:</strong> ${p.note}</p>`;
  }).join('');

  panel.innerHTML = `
    ${nextRaceHtml}
    <div class="card-grid">
      ${cardsHtml}
    </div>
    <div class="chart-card">
      <p class="title">Basis for these estimates</p>
      <p style="font-size:13px; color:var(--text-secondary); margin:0 0 10px;">${pred.vo2max_note}</p>
      <p style="font-size:13px; color:var(--text-secondary); margin:0 0 10px; border-top:1px solid var(--border); padding-top:10px;">
        Based on: ${pred.based_on_races.length ? pred.based_on_races.join(', ') : 'no clean races yet'}
      </p>
      ${pred.excluded_races && pred.excluded_races.length ? `
        <p style="font-size:12px; color:var(--text-muted); margin:8px 0 0;">
          Excluded: ${pred.excluded_races.map(r => `${r.name} (${r.reason})`).join('; ')}
        </p>
      ` : ''}
      ${notesHtml}
      ${pred.recent_key_sessions && pred.recent_key_sessions.length ? `
        <p style="font-size:13px; color:var(--text-muted); margin:10px 0 4px; border-top:1px solid var(--border); padding-top:10px;">
          Recent key sessions (for reference — not converted into a predicted time):
        </p>
        ${pred.recent_key_sessions.map(s => `
          <p style="font-size:13px; color:var(--text-secondary); margin:2px 0;">${s.date}: ${s.description}</p>
        `).join('')}
      ` : ''}
    </div>
  `;
}

async function loadTrainingPlan() {
  try {
    const res = await fetch('training_plan.json?v=' + Date.now());
    if (!res.ok) return;
    const plan = await res.json();
    const today = new Date().toISOString().slice(0, 10);
    const upcoming = plan.filter(s => s.date >= today).sort((a, b) => a.date.localeCompare(b.date));
    if (upcoming.length === 0) return;

    document.getElementById('planCard').style.display = 'block';
    document.getElementById('planRows').innerHTML = upcoming.map(s => `
      <tr style="border-top:1px solid var(--border);">
        <td style="padding:6px 8px;">${s.date}</td>
        <td style="padding:6px 8px; text-transform:capitalize;">${s.session_type}</td>
        <td style="padding:6px 8px;">${s.target_distance_km ?? '--'} km</td>
        <td style="padding:6px 8px;">${s.target_pace ?? '--'}</td>
      </tr>
    `).join('');
  } catch (e) {
    // no plan file yet, leave hidden
  }
}
