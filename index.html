<!--
  dashboard.html — DISPLAY LAYER

  Reads ONLY computed_data.json. Never reads garmin_data.json or
  manual_log.json directly, and never recalculates anything.
  If a number here is wrong, the bug is in build_computed.py, not here.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#2C6CB0">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131312">
<title>Coaching Dashboard</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  /* Theme: club yellow + blue carry identity and data series; green/
     amber/red are RESERVED for status (readiness, achilles, heat, ACWR
     zone) and never used decoratively. Dark palette steps validated
     separately against the dark surface — not an automatic flip. */
  :root {
    --bg: #F7F7F5;
    --surface: #FFFFFF;
    --border: #E5E5E3;
    --text-primary: #1A1A1A;
    --text-secondary: #4A4A4A;
    --text-muted: #6B7280;
    --club-blue: #2C6CB0;
    --club-yellow: #D4A800;
    --club-yellow-bright: #F5C518;
    --good: #2E7D32;      --good-bg: #EAF4EA;
    --warn: #B45309;      --warn-bg: #FCF1E3;
    --bad:  #A83232;      --bad-bg:  #F9ECEC;
    --grid: #E5E5E3;
    --tick: #6B7280;
    /* Redraw additions: a second surface for de-carded rows, a stronger
       rule for table heads, and the two club tints used as fills. */
    --surface-2: #F2F4F7;
    --border-strong: #C0CBD7;
    --blue-tint: #E9F0F8;
    --yellow-tint: #FBF1CC;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    /* legacy aliases used by older markup */
    --yellow: var(--club-yellow-bright);
    --yellow-text: #A88400;
    --blue: var(--club-blue);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131312;
      --surface: #1E1E1C;
      --border: #33332F;
      --text-primary: #ECECEA;
      --text-secondary: #C2C2BE;
      --text-muted: #8B8B86;
      --club-blue: #4A8CC8;
      --club-yellow: #AE922C;
      --club-yellow-bright: #C9A93B;
      --good: #6CBB72;      --good-bg: #1E2C1F;
      --warn: #D89A50;      --warn-bg: #302518;
      --bad:  #D97070;      --bad-bg:  #321D1D;
      --grid: #2C2C29;
      --tick: #8B8B86;
      --yellow-text: #C9A93B;
      --surface-2: #272724;
      --border-strong: #454540;
      --blue-tint: #1B2A38;
      --yellow-tint: #2E2817;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 1.5rem;
    padding-top: calc(1.5rem + 4px);
    font-variant-numeric: tabular-nums;
  }
  /* Club identity: a thin blue->yellow bar across the very top */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--club-blue) 0%, var(--club-blue) 55%, var(--club-yellow-bright) 55%, var(--club-yellow-bright) 100%);
    z-index: 10;
  }

  /* Hero briefing */
  .hero {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem;
    margin-bottom: 1rem;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .hero .session { font-size: 20px; font-weight: 600; margin: 2px 0 2px; }
  .hero .session .stype { text-transform: capitalize; }
  .hero .session-notes { font-size: 13px; color: var(--text-secondary); margin: 0 0 10px; }
  .readiness {
    display: flex; align-items: flex-start; gap: 8px;
    border-radius: 8px; padding: 10px 12px;
    font-size: 13px;
  }
  .readiness.good    { background: var(--good-bg); color: var(--good); }
  .readiness.caution { background: var(--warn-bg); color: var(--warn); }
  .readiness.flag    { background: var(--bad-bg);  color: var(--bad); }
  .readiness .icon { font-size: 14px; line-height: 1.4; }
  .chip {
    display: inline-block; font-size: 12px; border-radius: 999px;
    padding: 2px 10px; margin: 8px 6px 0 0;
    background: var(--bg); border: 1px solid var(--border); color: var(--text-secondary);
  }
  .chip.warn { background: var(--warn-bg); border-color: transparent; color: var(--warn); }
  .chip.bad  { background: var(--bad-bg);  border-color: transparent; color: var(--bad); }

  .spark-wrap { height: 34px; margin-top: 6px; position: relative; }
  .header { margin-bottom: 1.25rem; }
  .header .eyebrow { font-size: 13px; color: var(--text-muted); margin: 0; }
  .header h1 { font-size: 22px; font-weight: 500; margin: 4px 0 0; }
  .header .sub { font-size: 13px; color: var(--text-secondary); margin: 2px 0 0; }

  .summary-strip {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    margin: 1.25rem 0;
    font-size: 14px;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .summary-strip .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--yellow); flex-shrink: 0;
  }

  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 1.5rem;
  }
  .card {
    background: var(--surface);
    border-radius: 8px;
    padding: 1rem;
    border: 1px solid var(--border);
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .card .label { font-size: 13px; color: var(--text-muted); margin: 0 0 4px; }
  .card .value { font-size: 24px; font-weight: 500; margin: 0; }
  .card .delta { font-size: 12px; margin: 4px 0 0; }
  /* Delta chips are semantic: direction alone isn't good or bad — the
     metric decides (HRV up = good, RHR up = worth noting). Arrow glyphs
     carry the direction so colour is never the only signal. */
  .delta.good { color: var(--good); }
  .delta.warn { color: var(--warn); }
  .delta.up { color: var(--yellow-text); }
  .delta.down { color: var(--blue); }
  .delta.flat { color: var(--text-muted); }

  .chart-card {
    background: var(--surface);
    border-radius: 12px;
    padding: 1rem;
    margin-bottom: 1rem;
    border: 1px solid var(--border);
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .chart-card .title { font-size: 13px; color: var(--text-muted); margin: 0 0 12px; }
  .chart-wrap { position: relative; height: 220px; }

  .error {
    background: var(--bad-bg);
    border: 1px solid var(--bad);
    color: var(--bad);
    padding: 1rem;
    border-radius: 8px;
    font-size: 14px;
  }

  .tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 1.25rem;
    position: sticky;
    top: 4px;
    background: var(--bg);
    z-index: 5;
  }
  /* Five tabs have to fit one row on a phone — a wrapped tab bar
     reads as an overflow bug, not a menu. */
  .tab-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 13px;
    flex: 1;
    min-width: 0;
    padding: 9px 2px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    font-family: inherit;
  }
  .tab-btn.active {
    color: var(--text-primary);
    border-bottom-color: var(--blue);
  }
  .tab-panel { display: none; }

  /* ==========================================================
     REDRAW — verdict first, then the week, with the detail
     tabs de-carded into results-board rows.

     Three rules hold this together:
       1. Yellow means one of two things and nothing else: the
          primary action, or "look here" (a flagged row, the
          current week, a section rule).
       2. Green / amber / red stay reserved for status, exactly
          as before — the verdict stripe is the loudest use.
       3. Figures are set in mono with tabular figures so
          columns line up; prose stays in the system face.
     ========================================================== */

  /* Fixture rail — the countdown, demoted to one permanent line.
     A 200-day hero is wallpaper; a rail is cheap and always true. */
  .rail {
    display: flex; overflow-x: auto;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; margin-bottom: 1.25rem;
    font-family: var(--mono); font-size: 11px;
  }
  .rail span {
    flex: 1; min-width: 0; padding: 8px 6px; text-align: center;
    color: var(--text-muted); border-right: 1px solid var(--border);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .rail span:last-child { border-right: 0; }
  .rail b { color: var(--text-primary); font-weight: 600; }

  /* The verdict. Severity is carried by the left stripe AND the
     glyph, so colour is never the only signal. Green is
     deliberately quieter than amber — a good day should not
     shout in the same shape a bad one does. */
  .verdict {
    border-radius: 12px; padding: 14px 16px; margin-bottom: 12px;
    border: 1px solid var(--border); border-left: 5px solid var(--text-muted);
    background: var(--surface);
  }
  .verdict.good   { border-left-color: var(--good); }
  .verdict.caution{ border-left-color: var(--warn); background: var(--warn-bg); border-color: transparent; }
  .verdict.flag   { border-left-color: var(--bad);  background: var(--bad-bg);  border-color: transparent; }
  .verdict .tag {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em;
    text-transform: uppercase; font-weight: 600; margin: 0 0 7px;
  }
  .verdict.good .tag { color: var(--good); }
  .verdict.caution .tag { color: var(--warn); }
  .verdict.flag .tag { color: var(--bad); }
  .verdict h2 { font-size: 17px; line-height: 1.3; margin: 0 0 6px; font-weight: 600; }
  .verdict p { font-size: 13px; color: var(--text-secondary); margin: 0; line-height: 1.5; }

  /* Today's session, second. */
  .session-card {
    display: flex; align-items: center; justify-content: space-between;
    gap: 14px; background: var(--blue-tint); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 12px;
  }
  .session-card .lab {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--club-blue); font-weight: 600;
  }
  .session-card .big {
    font-size: 26px; font-weight: 600; margin: 2px 0 0; line-height: 1.15;
    text-transform: capitalize;
  }
  .session-card .sub { font-size: 12.5px; color: var(--text-secondary); margin: 3px 0 0; }
  .session-card .aside { text-align: right; font-family: var(--mono); flex-shrink: 0; }
  .session-card .aside em {
    display: block; font-style: normal; font-size: 9.5px;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted);
  }
  .session-card .aside i { font-style: normal; font-size: 21px; font-weight: 600; }

  .cta {
    display: block; width: 100%; text-align: center; border: 0;
    border-radius: 10px; padding: 13px; background: var(--club-yellow-bright);
    color: #231E06; font-size: 15px; font-weight: 600; text-decoration: none;
    cursor: pointer; font-family: inherit;
  }

  /* Section heading with the yellow rule under it. */
  .sect { margin: 1.5rem 0 0; }
  .sect-h {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 10px; padding-bottom: 8px; border-bottom: 2px solid var(--club-yellow);
    margin-bottom: 10px;
  }
  .sect-h b {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.13em;
    text-transform: uppercase; color: var(--text-secondary); font-weight: 600;
  }
  .sect-h span { font-family: var(--mono); font-size: 11px; color: var(--text-muted); }

  /* Plain-English explainer. Always visible, never behind a tap —
     a metric you have to remember the meaning of is a metric you
     will not use. */
  .plain {
    font-size: 12.5px; line-height: 1.5; color: var(--text-secondary);
    padding-left: 11px; border-left: 3px solid var(--blue-tint);
    margin: 0 0 12px;
  }
  .plain b { color: var(--text-primary); font-weight: 600; }

  /* The week, as a lane. Today is lifted out of the row rather
     than merely tinted, so it reads at a glance. */
  .lane { display: flex; gap: 4px; }
  .lane button {
    flex: 1; min-width: 0; border: 1px solid var(--border);
    background: var(--surface-2); border-radius: 8px;
    padding: 7px 1px 8px; text-align: center; cursor: pointer;
    color: inherit; font-family: inherit;
  }
  .lane button em {
    display: block; font-style: normal; font-size: 9px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text-muted); font-family: var(--mono);
  }
  .lane button b {
    display: block; font-size: 16px; font-weight: 600; margin-top: 2px;
    font-family: var(--mono);
  }
  .lane button s {
    display: block; text-decoration: none; font-size: 8px; letter-spacing: 0.05em;
    text-transform: uppercase; color: var(--text-muted);
  }
  .lane button.is-today {
    background: var(--club-blue); border-color: var(--club-blue); color: #fff;
    transform: translateY(-4px);
  }
  .lane button.is-today em, .lane button.is-today s { color: rgba(255,255,255,0.8); }
  .lane button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--club-yellow); }
  .daynote {
    margin-top: 9px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--surface-2); padding: 10px 12px; font-size: 12.5px;
    color: var(--text-secondary); line-height: 1.45;
  }
  .daynote b { color: var(--text-primary); font-weight: 600; }

  /* Weekly volume. The number lives in the bar, which frees the
     row underneath for dates — month named only when it changes. */
  .bars { display: flex; gap: 5px; }
  .bars .col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .bars .track { height: 74px; display: flex; align-items: flex-end; }
  .bars i {
    width: 100%; background: var(--blue-tint); border-top: 2px solid var(--club-blue);
    border-radius: 3px 3px 0 0; display: flex; justify-content: center;
    align-items: flex-start; padding-top: 4px; min-height: 14px;
    font-style: normal;
  }
  .bars i b {
    font-family: var(--mono); font-size: 10.5px; font-weight: 600;
    color: var(--club-blue); line-height: 1;
  }
  .bars i.now { background: var(--yellow-tint); border-top-color: var(--club-yellow); }
  .bars i.now b { color: var(--yellow-text); }
  .bars .col > span {
    font-family: var(--mono); font-size: 9px; color: var(--text-muted);
    text-align: center; padding-top: 5px; border-top: 1px solid var(--border);
    white-space: nowrap; overflow: hidden;
  }
  .bars .col.cur > span { color: var(--yellow-text); }

  /* Results board — no cards, hairline rules, deltas beside the
     figure rather than implied. Roughly twice the content per
     screen, which is what these pages are actually for. */
  .board .row {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--border);
    font-family: var(--mono);
  }
  .board .row .k {
    font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--text-secondary);
  }
  .board .row .r { white-space: nowrap; }
  .board .row .v { font-size: 17px; font-weight: 600; }
  .board .row .d { font-size: 11px; margin-left: 9px; }
  .board .row.is-flag { background: var(--yellow-tint); box-shadow: inset 3px 0 0 var(--club-yellow); }
  .d-good { color: var(--good); } .d-warn { color: var(--warn); }
  .d-bad { color: var(--bad); } .d-mute { color: var(--text-muted); }

  .tbl { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 12px; }
  .tbl th {
    text-align: right; font-weight: 500; font-size: 9.5px; letter-spacing: 0.09em;
    text-transform: uppercase; color: var(--text-muted); padding: 0 0 7px;
    border-bottom: 1px solid var(--border-strong);
  }
  .tbl th:first-child, .tbl td:first-child { text-align: left; }
  .tbl td { text-align: right; padding: 7px 0; border-bottom: 1px solid var(--border); }
  .tbl tr.cur td { background: var(--yellow-tint); font-weight: 600; }
  .tbl tr.cur td:first-child { box-shadow: inset 3px 0 0 var(--club-yellow); padding-left: 7px; }
  .tbl tr.ex td { color: var(--text-muted); }
  .tbl td.l, .tbl th.l { text-align: left; padding-right: 8px; }
  .tblwrap { overflow-x: auto; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

  <div class="header">
    <p class="eyebrow">Garmin + Open-Meteo</p>
    <h1>Coaching dashboard</h1>
    <p class="sub" id="dateLabel">Loading...</p>
  </div>

  <div style="display:flex; gap:16px; flex-wrap:wrap; margin-bottom:1.25rem;" id="formLinks"></div>

  <div class="rail" id="fixtureRail" hidden></div>

  <!-- Five tabs, not seven. Overview and Plan are one screen now
       (the verdict and the shape of the week belong together);
       Performance and ACWR are both "how is it trending"; and the
       Predictor's projections only mean anything next to the
       fixtures they are projecting for, so they live in Races.
       Nothing was dropped — the panels below still host each
       original builder's output by its original id. -->
  <div class="tabs" style="flex-wrap:wrap;">
    <button class="tab-btn active" data-tab="today">Today</button>
    <button class="tab-btn" data-tab="recovery">Recovery</button>
    <button class="tab-btn" data-tab="trends">Trends</button>
    <button class="tab-btn" data-tab="races">Races</button>
    <button class="tab-btn" data-tab="coach">Coach</button>
  </div>

  <div id="content">
    <p class="error" style="display:none;" id="errorBox"></p>
    <div id="todayTop"></div>
    <div id="tab-plan"></div>
  </div>

  <div id="panel-recovery" class="tab-panel" style="display:none;"></div>

  <div id="panel-trends" class="tab-panel" style="display:none;">
    <div id="tab-performance"></div>
    <div id="tab-acwr"></div>
  </div>

  <div id="panel-races" class="tab-panel" style="display:none;">
    <div id="tab-races"></div>
    <div id="tab-predictor"></div>
  </div>

  <div id="tab-coach" class="tab-panel" style="display:none;"></div>

<script>
// If the Chart.js CDN is unreachable (offline PWA, network blip), stub
// it out so cards, tables and the coach review still render — losing
// the charts must never blank the whole dashboard.
if (typeof Chart === 'undefined') window.Chart = class { constructor() {} };

// Chart colours come from the CSS theme so light/dark stay in sync.
// Values are read once at load; if the OS theme flips mid-session the
// next reload picks it up (matchMedia listener below forces that).
function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}
const THEME = {};
function loadTheme() {
  THEME.blue = cssVar('--club-blue');
  THEME.yellow = cssVar('--club-yellow');
  THEME.good = cssVar('--good');
  THEME.warn = cssVar('--warn');
  THEME.bad = cssVar('--bad');
  THEME.grid = cssVar('--grid');
  THEME.tick = cssVar('--tick');
  THEME.ink = cssVar('--text-primary');
  THEME.muted = cssVar('--text-muted');
}
loadTheme();
if (window.matchMedia) {
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => location.reload());
}
function axisXY(opts = {}) {
  return {
    y: Object.assign({ ticks: { color: THEME.tick }, grid: { color: THEME.grid } }, opts.y || {}),
    x: Object.assign({ ticks: { color: THEME.tick }, grid: { display: false } }, opts.x || {}),
  };
}

// Shades a horizontal band (e.g. the ACWR 0.8-1.3 safe zone) behind the
// data so "in the zone" is visible without remembering the range.
const bandPlugin = {
  id: 'band',
  beforeDatasetsDraw(chart, args, opts) {
    if (!opts || opts.min == null) return;
    const { ctx, chartArea, scales } = chart;
    if (!chartArea || !scales.y) return;
    const top = scales.y.getPixelForValue(opts.max);
    const bottom = scales.y.getPixelForValue(opts.min);
    ctx.save();
    ctx.fillStyle = opts.color;
    ctx.fillRect(chartArea.left, top, chartArea.right - chartArea.left, bottom - top);
    ctx.restore();
  },
};

// Tiny axis-less trend line inside a stat card.
function sparkline(canvasId, values, color) {
  const el = document.getElementById(canvasId);
  if (!el) return;
  new Chart(el, {
    type: 'line',
    data: {
      labels: values.map((_, i) => i),
      datasets: [{ data: values, borderColor: color, borderWidth: 2, pointRadius: 0, tension: 0.35, spanGaps: true }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: { x: { display: false }, y: { display: false } },
      plugins: { legend: { display: false }, tooltip: { enabled: false } },
      animation: false,
    },
  });
}

// Semantic delta chip: the metric decides whether "up" is good.
function deltaChip(delta, unit, upIsGood) {
  if (delta === null || delta === undefined) return '<p class="delta flat">—</p>';
  const arrow = delta > 0.5 ? '▲' : delta < -0.5 ? '▼' : '●';
  let cls = 'flat';
  if (Math.abs(delta) > 0.5) {
    const isGood = (delta > 0) === upIsGood;
    cls = isGood ? 'good' : 'warn';
  }
  const sign = delta > 0 ? '+' : '';
  return `<p class="delta ${cls}">${arrow} ${sign}${delta}${unit} vs 7d</p>`;
}

// UK-format date display helpers. Internal data stays ISO (YYYY-MM-DD)
// everywhere — these are for what the eye reads, nothing else.
function fmtDayMonth(dateStr) {          // "29 Jul"
  if (!dateStr) return '--';
  return new Date(dateStr + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}
function fmtDate(dateStr) {              // "29 Jul 2026"
  if (!dateStr) return '--';
  return new Date(dateStr + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}

// Fill-in URL of the daily log Google Form — powers the "Log today's
// session" button in the hero. The watch supplies distance, pace and HR;
// this form carries the things only Shep knows: achilles, RPE, and what
// the session actually felt like.
const DAILY_FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSe7Bnpz45kGDxRVz8KQKbb-B9-7j7ThcAul5xJbVWftQTHL6A/viewform';
const PLAN_FORM_URL  = 'https://docs.google.com/forms/d/e/1FAIpQLSfnpMureLGUjyN_6NG48_ruoC4twGbw6SGsUNH8HpP5G_3oDg/viewform';
const RACE_FORM_URL  = 'https://docs.google.com/forms/d/e/1FAIpQLSeyiW4JbXtwu1pNrYdwGJzQTpDO_oaVP4idEzRbarEwY7XQ2Q/viewform';

// Fill-in URL of the "Weekly review response" Google Form — powers the
// Respond button on the Coach tab. See AUTOMATION_SETUP.md step 2.
const REVIEW_FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSelVvuccMxIiMpIy9vjmGPHJjjV4mwHOB4ReQH0uel8d2PGcA/viewform';

async function loadDashboard() {
  const content = document.getElementById('content');
  const errorBox = document.getElementById('errorBox');

  let data;
  try {
    const res = await fetch('computed_data.json?v=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    data = await res.json();
  } catch (err) {
    errorBox.style.display = 'block';
    errorBox.textContent = 'Could not load computed_data.json: ' + err.message;
    return;
  }

  if (!Array.isArray(data) || data.length === 0) {
    errorBox.style.display = 'block';
    errorBox.textContent = 'computed_data.json loaded but contained no rows.';
    return;
  }

  data.sort((a, b) => a.date.localeCompare(b.date));
  const latest = data[data.length - 1];

  // The header used to print the last data row's date and call it
  // today. GitHub runs the scheduled pull hours late on this repo, so
  // on a Monday morning the dashboard said "Sunday 30 August" and
  // offered Sunday's long run as today's session (31 Aug). The day is
  // the clock's business; how fresh the data is, is a separate fact —
  // state both rather than letting one stand in for the other.
  const todayStr = toDateStr(new Date());
  const todayRow = data.find(r => r.date === todayStr) || null;
  // Wellness still falls back to the most recent row we have: yesterday's
  // HRV is worth showing, it just must not be labelled as today's.
  const today = todayRow || latest;
  const stale = latest.date !== todayStr;

  document.getElementById('dateLabel').textContent =
    new Date(todayStr + 'T00:00:00').toLocaleDateString('en-GB',
      { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })
    + (stale ? ` · data to ${fmtDayMonth(latest.date)}` : '');

  // Today's planned session for the hero briefing
  let planAll = [];
  let todayPlan = null;
  try {
    const planRes = await fetch('training_plan.json?v=' + Date.now());
    if (planRes.ok) {
      planAll = await planRes.json();
      // Keyed off the clock, not the data — the session you are meant
      // to run today does not depend on whether Garmin has synced.
      todayPlan = planAll.find(s => s.date === todayStr) || null;
    }
  } catch (e) { /* hero renders without the session */ }

  const weekly = await fetchJson('weekly_summary.json');
  // VO2max to one decimal. computed_data carries Garmin's rounded
  // integer; vo2max_history.json keeps the precision, and at this
  // level a tenth is the difference between drifting and climbing.
  const vo2Hist = await fetchJson('vo2max_history.json');
  const vo2Latest = (vo2Hist && vo2Hist.length) ? vo2Hist[vo2Hist.length - 1] : null;
  renderFixtureRail(todayStr);

  // Has today been logged? achilles_score is the field the form always
  // carries, so its presence is the reliable "logged" signal. Nudge only
  // when it's missing — a silent dashboard is how two weeks of logging
  // quietly disappeared once already.
  // Must read today's own row, not the latest one: with the fallback
  // above, yesterday's log would otherwise tick today off and hide the
  // button — the exact silence this nudge exists to prevent.
  const loggedToday = !!todayRow
    && todayRow.achilles_score !== null && todayRow.achilles_score !== undefined;
  // Yellow is the primary action. It is the one button on the screen,
  // so it gets the club colour and nothing else competes for it.
  const logStripHtml = loggedToday
    ? `<p style="font-size:12px; color:var(--good); margin:0;">✓ Today's session logged</p>`
    : (DAILY_FORM_URL
        ? `<a class="cta" href="${DAILY_FORM_URL}" rel="noopener">Log today's session</a>`
        : `<p style="font-size:12px; color:var(--text-muted); margin:0;">Not logged today — set DAILY_FORM_URL in index.html for a one-tap button here.</p>`);

  const level = today.readiness_level || 'good';
  const levelTag = { good: 'All clear', caution: 'Worth noting', flag: 'Readiness flag' }[level] || 'All clear';
  const levelIcon = { good: '✓', caution: '△', flag: '✕' }[level] || '✓';
  const heatChip = today.heat_risk === 'high'
    ? '<span class="chip bad">Heat risk high</span>'
    : today.heat_risk === 'moderate' ? '<span class="chip warn">Heat moderate</span>' : '';

  // The supporting line under the verdict: the figures that produced
  // it, stated rather than implied. A verdict you cannot check is a
  // verdict you stop trusting.
  const evidence = [];
  if (today.hrv_last_night != null) {
    evidence.push(`HRV ${today.hrv_last_night}` +
      (today.hrv_baseline_7d != null ? ` against a ${today.hrv_baseline_7d} baseline` : ''));
  }
  if (today.rhr != null) {
    evidence.push(`RHR ${today.rhr}` +
      (today.rhr_baseline_7d != null ? ` against ${today.rhr_baseline_7d}` : ''));
  }
  if (today.sleep_score != null) evidence.push(`sleep ${today.sleep_score}`);
  if (today.achilles_score != null) evidence.push(`achilles ${today.achilles_score}`);
  const confounders = today.recovery_confounders || [];
  const evidenceLine = evidence.length
    ? evidence.join(', ') + '.' + (confounders.length
        ? ` ${confounders.join(' and ')} logged — an explained dip, not a trend.`
        : '')
    : '';

  document.getElementById('todayTop').innerHTML = `
    <div class="verdict ${level}">
      <p class="tag">${levelIcon} ${levelTag}</p>
      <h2>${esc(today.today_summary || 'No readiness data yet.')}</h2>
      ${evidenceLine ? `<p>${esc(evidenceLine)}</p>` : ''}
    </div>

    <div class="session-card">
      <div>
        <p class="lab">Today${stale ? '' : ''}</p>
        <p class="big">${todayPlan ? esc(todayPlan.session_type) : 'Nothing planned'}${todayPlan && todayPlan.target_distance_km ? ` · ${todayPlan.target_distance_km} km` : ''}</p>
        ${todayPlan && todayPlan.target_pace ? `<p class="sub">${esc(todayPlan.target_pace)}</p>` : ''}
        ${nextSessionLine(planAll, todayStr)}
      </div>
      ${today.achilles_score != null ? `
        <div class="aside">
          <em>Achilles</em>
          <i style="color:${today.achilles_score >= 3 ? 'var(--bad)' : 'var(--good)'};">${today.achilles_score}</i>
        </div>` : ''}
    </div>

    <div style="margin-bottom:4px;">
      ${stale ? `<span class="chip warn">Readiness from ${fmtDayMonth(latest.date)}</span>` : ''}
      ${heatChip}
      ${today.achilles_score >= 3 ? `<span class="chip bad">Achilles ${today.achilles_score}/10</span>` : ''}
      ${confounders.map(c => `<span class="chip">${esc(c)} noted</span>`).join('')}
      ${today.acwr ? `<span class="chip">ACWR ${today.acwr}${today.acwr_status ? ' · ' + today.acwr_status.toLowerCase() : ''}</span>` : ''}
    </div>

    <div style="margin-top:12px;">${logStripHtml}</div>

    ${weekLaneHtml(planAll, todayStr)}
    ${volumeBarsHtml(weekly, planAll, todayStr)}
  `;
  wireLane();

  // Recovery: the same figures the verdict used, de-carded. Rules and
  // mono figures instead of boxes — roughly twice the content per
  // screen, with every delta stated next to its number.
  document.getElementById('panel-recovery').innerHTML = `
    <div class="board">
      ${boardRow('HRV last night', today.hrv_last_night, today.hrv_delta_from_baseline,
                 today.hrv_baseline_7d, true)}
      ${today.hrv_weekly_avg != null ? `
        <div class="row"><span class="k">HRV 7-day avg</span>
          <span class="r"><span class="v">${today.hrv_weekly_avg}</span>
          <span class="d d-mute">watch figure</span></span></div>` : ''}
      ${boardRow('Resting HR', today.rhr, today.rhr_delta_from_baseline,
                 today.rhr_baseline_7d, false)}
      <div class="row"><span class="k">Sleep</span>
        <span class="r"><span class="v">${today.sleep_duration_hrs != null ? hrsMins(today.sleep_duration_hrs) : '--'}</span>
        <span class="d ${today.sleep_score >= 80 ? 'd-good' : 'd-mute'}">score ${today.sleep_score ?? '--'}</span></span></div>
      <div class="row"><span class="k">Body battery</span>
        <span class="r"><span class="v">${today.body_battery_high ?? '--'}</span>
        <span class="d d-mute">at wake</span></span></div>
      <div class="row${today.achilles_score >= 3 ? ' is-flag' : ''}"><span class="k">Achilles</span>
        <span class="r"><span class="v">${today.achilles_score ?? '--'}</span>
        <span class="d ${today.achilles_score >= 3 ? 'd-bad' : 'd-good'}">${today.achilles_score >= 3 ? 'flagged' : 'clear'}</span></span></div>
      ${today.acwr != null ? `
        <div class="row"><span class="k">ACWR</span>
          <span class="r"><span class="v">${today.acwr}</span>
          <span class="d ${today.acwr_status === 'OPTIMAL' ? 'd-good' : 'd-warn'}">${esc((today.acwr_status || '').toLowerCase())}</span></span></div>` : ''}
      ${vo2Latest ? `
        <div class="row"><span class="k">VO₂max</span>
          <span class="r"><span class="v">${vo2Latest.vo2max.toFixed(1)}</span>
          <span class="d d-mute">${fmtDayMonth(vo2Latest.vo2max_date || vo2Latest.date)}</span></span></div>` : ''}
      ${today.heat_risk ? `
        <div class="row${today.heat_risk === 'high' ? ' is-flag' : ''}"><span class="k">Heat risk</span>
          <span class="r"><span class="v" style="font-size:14px;">${esc(today.heat_risk)}</span>
          <span class="d d-mute">asthma watch</span></span></div>` : ''}
    </div>

    ${today.session_notes ? `
      <div class="sect">
        <div class="sect-h"><b>Your note</b><span>${fmtDayMonth(today.date)}</span></div>
        <p class="daynote">${esc(today.session_notes)}</p>
      </div>` : ''}

    <div class="chart-card" style="margin-top:1.5rem;">
      <p class="title">HRV — 14 days (dashed = prior 7 days, excluding that night)</p>
      <div class="chart-wrap" style="height:160px;"><canvas id="hrvChart"></canvas></div>
    </div>

    <div class="chart-card">
      <p class="title">RHR — 14 days (dashed = prior 7 days, excluding that morning)</p>
      <div class="chart-wrap" style="height:160px;"><canvas id="rhrChart"></canvas></div>
    </div>

    <div class="chart-card">
      <p class="title">Sleep score &amp; body battery</p>
      <div class="chart-wrap" style="height:180px;"><canvas id="sleepBbChart"></canvas></div>
    </div>

    <div class="chart-card">
      <p class="title">Achilles score (0 = no issue, 10 = severe)</p>
      <div class="chart-wrap" style="height:160px;"><canvas id="achillesChart"></canvas></div>
    </div>
  `;

  const labels = data.map(r => fmtDayMonth(r.date));

  // One metric per chart, own scale, with its 7-day baseline dashed —
  // never two scales on one plot.
  function metricChart(canvasId, series, baseline, color) {
    new Chart(document.getElementById(canvasId), {
      type: 'line',
      data: {
        labels,
        datasets: [
          { label: 'daily', data: series, borderColor: color, backgroundColor: color, borderWidth: 2, tension: 0.3, spanGaps: true, pointRadius: 2 },
          { label: '7d baseline', data: baseline, borderColor: THEME.muted, borderDash: [5, 4], borderWidth: 1.5, pointRadius: 0, spanGaps: true },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: axisXY(),
        plugins: { legend: { display: false } },
      },
    });
  }
  metricChart('hrvChart', data.map(r => r.hrv_last_night), data.map(r => r.hrv_baseline_7d), THEME.blue);
  metricChart('rhrChart', data.map(r => r.rhr), data.map(r => r.rhr_baseline_7d), THEME.yellow);

  // Sleep + body battery share one genuine 0-100 scale, so one chart is fine.
  new Chart(document.getElementById('sleepBbChart'), {
    type: 'line',
    data: {
      labels,
      datasets: [
        { label: 'Sleep score', data: data.map(r => r.sleep_score), borderColor: THEME.blue, backgroundColor: THEME.blue, borderWidth: 2, tension: 0.3, spanGaps: true, pointRadius: 2 },
        { label: 'Body battery', data: data.map(r => r.body_battery_high), borderColor: THEME.yellow, backgroundColor: THEME.yellow, borderWidth: 2, tension: 0.3, spanGaps: true, pointRadius: 2 },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: axisXY({ y: { min: 0, max: 100 } }),
      plugins: { legend: { labels: { color: THEME.ink } } },
    },
  });

  // Achilles is a status metric — it wears the status colour.
  new Chart(document.getElementById('achillesChart'), {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: 'Achilles (0-10)',
        data: data.map(r => r.achilles_score),
        borderColor: THEME.bad,
        backgroundColor: THEME.bad,
        borderWidth: 2,
        tension: 0.2,
        spanGaps: true,
        pointRadius: 4,
      }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: axisXY({ y: { min: 0, max: 10, ticks: { color: THEME.tick, stepSize: 2 } } }),
      plugins: { legend: { display: false } },
    },
  });

  setupTabs(data);
  return data;
}

// ============================================================
// Today panel helpers
// ============================================================

function hrsMins(hrs) {
  if (hrs == null) return '--';
  const h = Math.floor(hrs);
  const m = Math.round((hrs - h) * 60);
  return `${h}:${String(m).padStart(2, '0')}`;
}

// One results-board row. upIsGood decides whether a rise is read as
// good or as worth noting — direction alone is never the signal, the
// metric decides (HRV up is good, RHR up is not).
function boardRow(label, value, delta, baseline, upIsGood) {
  if (value == null) return '';
  let cls = 'd-mute', txt = 'no baseline yet';
  if (delta != null && baseline != null) {
    const meaningful = Math.abs(delta) > 0.5;
    const isGood = (delta > 0) === upIsGood;
    cls = !meaningful ? 'd-mute' : isGood ? 'd-good' : 'd-bad';
    txt = `${delta > 0 ? '+' : ''}${delta} vs ${baseline}`;
  }
  const flagged = delta != null && Math.abs(delta) > 0.5 && (delta > 0) !== upIsGood;
  return `<div class="row${flagged ? ' is-flag' : ''}"><span class="k">${label}</span>
    <span class="r"><span class="v">${value}</span><span class="d ${cls}">${txt}</span></span></div>`;
}

// The next thing on the plan after today — so the session card answers
// "and then what" without a tab change.
function nextSessionLine(plan, todayStr) {
  const next = (plan || [])
    .filter(s => s.date > todayStr)
    .sort((a, b) => a.date.localeCompare(b.date))[0];
  if (!next) return '';
  const day = new Date(next.date + 'T00:00:00').toLocaleDateString('en-GB', { weekday: 'short' });
  const dist = next.target_distance_km ? ` ${next.target_distance_km} km` : '';
  return `<p class="sub">Next: ${esc(next.session_type)}${dist}, ${day}</p>`;
}

// The countdown, as a rail. Nearest three fixtures with a date.
async function renderFixtureRail(todayStr) {
  const fixtures = (await fetchJson('fixtures.json')) || [];
  const next = fixtures
    .filter(f => f.date && f.date >= todayStr)
    .sort((a, b) => a.date.localeCompare(b.date))
    .slice(0, 3);
  if (!next.length) return;
  const rail = document.getElementById('fixtureRail');
  rail.innerHTML = next.map(f => {
    const days = Math.round(
      (new Date(f.date + 'T00:00:00') - new Date(todayStr + 'T00:00:00')) / 86400000);
    // The rail is three cells on a phone, so names have to be short
    // enough to read whole — "Cheltenham Half Marathon" becomes
    // "Cheltenham", "Cross country" becomes "XC".
    const trimmed = f.name.replace(/\s+(Half\s+)?Marathon$/i, '').replace(/\s+\d+K?$/i, '');
    const short = /cross country/i.test(f.name) ? 'XC'
      : trimmed.length <= 12 ? trimmed : trimmed.split(' ')[0];
    return `<span>${esc(short)} <b>${days === 0 ? 'today' : days + 'd'}</b></span>`;
  }).join('');
  rail.hidden = false;
}

// This week as a lane: seven days, today lifted out of the row rather
// than merely tinted. Tapping a day shows its note — session detail is
// a tap away rather than seven paragraphs deep.
const LANE_NOTES = [];
function weekLaneHtml(plan, todayStr) {
  const weekStart = getWeekStart(todayStr);
  const planByDate = {};
  (plan || []).forEach(s => { planByDate[s.date] = s; });

  LANE_NOTES.length = 0;
  let plannedKm = 0;
  const cells = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(weekStart + 'T00:00:00');
    d.setDate(d.getDate() + i);
    const ds = toDateStr(d);
    const s = planByDate[ds];
    const isToday = ds === todayStr;
    if (s && s.target_distance_km) plannedKm += s.target_distance_km;
    const letter = d.toLocaleDateString('en-GB', { weekday: 'narrow' });
    const value = s && s.target_distance_km ? s.target_distance_km : '—';
    const type = s ? s.session_type : '';
    LANE_NOTES.push({
      head: `${d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' })}` +
            (s ? ` · ${s.session_type}${s.target_distance_km ? ' ' + s.target_distance_km + ' km' : ''}` : ' · nothing planned'),
      body: s && s.notes ? s.notes : (s && s.target_pace ? s.target_pace : 'No note on this one.'),
    });
    cells.push(`<button type="button" class="${isToday ? 'is-today' : ''}"
        aria-pressed="${isToday ? 'true' : 'false'}" data-i="${i}">
      <em>${letter}</em><b>${value}</b><s>${esc(type || '—')}</s></button>`);
  }

  return `
    <div class="sect">
      <div class="sect-h"><b>This week</b><span>${plannedKm ? plannedKm.toFixed(0) + ' km planned' : ''}</span></div>
      <div class="lane" id="lane">${cells.join('')}</div>
      <div class="daynote" id="daynote" aria-live="polite"></div>
    </div>`;
}

function wireLane() {
  const lane = document.getElementById('lane');
  const out = document.getElementById('daynote');
  if (!lane || !out) return;
  const show = i => {
    const n = LANE_NOTES[i];
    if (!n) return;
    out.innerHTML = `<b>${esc(n.head)}</b> — ${esc(n.body)}`;
    lane.querySelectorAll('button').forEach((b, j) =>
      b.setAttribute('aria-pressed', j === i ? 'true' : 'false'));
  };
  lane.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (b) show(parseInt(b.dataset.i, 10));
  });
  const todayIdx = Array.from(lane.querySelectorAll('button'))
    .findIndex(b => b.classList.contains('is-today'));
  show(todayIdx >= 0 ? todayIdx : 0);
}

// Weekly volume. The number lives inside its bar, which frees the row
// underneath for dates. The current week is shown as PLANNED, in
// yellow, because it hasn't happened yet — weekly_summary carries it
// as an in-progress row reading 0, which would draw a false collapse.
function volumeBarsHtml(weekly, plan, todayStr) {
  const weeks = ((weekly && weekly.weeks) || []).filter(w => !w.in_progress);
  if (weeks.length < 2) return '';
  const recent = weeks.slice(-7);

  const weekStart = getWeekStart(todayStr);
  let plannedKm = 0;
  (plan || []).forEach(s => {
    if (s.date >= weekStart && s.target_distance_km) {
      const d = new Date(weekStart + 'T00:00:00');
      d.setDate(d.getDate() + 6);
      if (s.date <= toDateStr(d)) plannedKm += s.target_distance_km;
    }
  });

  const series = recent.map(w => ({ start: w.week_start, km: w.km, planned: false }));
  if (plannedKm) series.push({ start: weekStart, km: plannedKm, planned: true });

  const max = Math.max(...series.map(s => s.km)) || 1;
  let lastMonth = null;
  const cols = series.map(s => {
    const d = new Date(s.start + 'T00:00:00');
    const month = d.toLocaleDateString('en-GB', { month: 'short' });
    const label = month === lastMonth
      ? String(d.getDate())
      : `${d.getDate()} ${month}`;
    lastMonth = month;
    const h = Math.max(14, Math.round(s.km / max * 74));
    return `<div class="col${s.planned ? ' cur' : ''}">
        <div class="track"><i class="${s.planned ? 'now' : ''}" style="height:${h}px;">
          <b>${Math.round(s.km)}</b></i></div>
        <span>${label}</span>
      </div>`;
  }).join('');

  return `
    <div class="sect">
      <div class="sect-h"><b>Volume · km per week</b><span>peak ${Math.round(max)}</span></div>
      <div class="bars">${cols}</div>
      ${plannedKm ? `<p class="plain" style="margin-top:10px;">Yellow is this week, and
        <b>planned rather than run</b> — it fills in as sessions are logged.</p>` : ''}
    </div>`;
}

// Tab name -> the element that holds it. "today" is the original
// #content div; the merged tabs are wrappers that each contain the
// original builders' target divs untouched, so no builder had to
// learn where it now lives.
const TAB_PANELS = {
  today: 'content',
  recovery: 'panel-recovery',
  trends: 'panel-trends',
  races: 'panel-races',
  coach: 'tab-coach',
};

function setupTabs(data) {
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.style.display = 'none');
      document.getElementById('content').style.display = 'none';

      btn.classList.add('active');
      const target = TAB_PANELS[btn.dataset.tab];
      if (target) document.getElementById(target).style.display = 'block';
      window.scrollTo(0, 0);
    });
  });

  buildCoachTab();
  buildAcwrTab(data);
  buildPlanTab(data);
  buildPerformanceTab(data);
  buildPredictorTab();
  buildRacesTab();
}

const esc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

// Minimal markdown renderer for the weekly review — headings, bold,
// bullets, paragraphs. Content is coach-authored, but escape anyway.
function renderMd(md) {
  return esc(md).split(/\n{2,}/).map(block => {
    const lines = block.split('\n');
    if (lines.every(l => /^\s*[-*] /.test(l))) {
      return '<ul style="margin:8px 0; padding-left:20px;">' +
        lines.map(l => `<li style="font-size:13px; color:var(--text-secondary); margin:3px 0;">${inline(l.replace(/^\s*[-*] /, ''))}</li>`).join('') +
        '</ul>';
    }
    const h = block.match(/^(#{1,4}) (.*)$/);
    if (h) return `<p style="font-size:14px; font-weight:600; margin:14px 0 4px;">${inline(h[2])}</p>`;
    return `<p style="font-size:13px; color:var(--text-secondary); margin:8px 0; line-height:1.5;">${inline(block.replace(/\n/g, '<br>'))}</p>`;
  }).join('');
  function inline(s) {
    return s.replace(/\*\*(.+?)\*\*/g, '<strong style="color:var(--text-primary);">$1</strong>');
  }
}

async function fetchJson(name) {
  try {
    const res = await fetch(name + '?v=' + Date.now());
    if (!res.ok) return null;
    return await res.json();
  } catch (e) { return null; }
}

function toDateStr(d) {
  // Always use LOCAL date components, never toISOString() — that
  // converts to UTC and silently shifts dates back a day whenever
  // the local timezone is ahead of UTC (e.g. UK on BST).
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function getWeekStart(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const day = d.getDay(); // 0=Sun, 1=Mon...
  const diff = day === 0 ? -6 : 1 - day; // shift to Monday
  d.setDate(d.getDate() + diff);
  return toDateStr(d);
}

function fmtWeekLabel(weekStartStr) {
  const start = new Date(weekStartStr + 'T00:00:00');
  const end = new Date(start);
  end.setDate(end.getDate() + 6);
  const fmt = d => d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  return `Week of ${fmt(start)} - ${fmt(end)}`;
}

          It flags when two quality sessions inside ${esc(String(paceTarget.window_days))} days come in
          3+ sec/km inside target <em>and</em> you rated them RPE 6 or easier — both halves are
          needed, because quick-but-it-hurt is a good session and on-pace-but-easy is a taper.
          The fix is a tighter number on the next plan, <b>never running harder inside a
          session</b>.</p>
        <p style="font-size:13px; color:var(--text-secondary); margin:0 0 8px;">
          ${f.count} quality sessions in the last ${esc(String(paceTarget.window_days))} days came in
          <strong>${f.mean_beat_sec_per_km} sec/km inside target</strong> at low effort.</p>
        <table style="width:100%; border-collapse:collapse; font-size:12px; margin-bottom:8px;">
          <tbody>
            ${(paceTarget.sessions || []).filter(s => f.sessions.includes(s.date)).map(s => `
              <tr style="border-top:1px solid var(--border);">
                <td style="padding:4px 8px 4px 0;">${fmtDayMonth(s.date)}</td>
                <td style="padding:4px 8px; text-transform:capitalize;">${esc(s.session_type || '')}</td>
                <td style="padding:4px 8px;">target ${secs(s.target_sec_per_km)}</td>
                <td style="padding:4px 8px;"><strong>ran ${secs(s.actual_sec_per_km)}</strong></td>
                <td style="padding:4px 0 4px 8px; color:var(--text-muted);">RPE ${s.rpe}</td>
              </tr>`).join('')}
          </tbody>
        </table>
        <p style="font-size:13px; color:var(--text-secondary); margin:0;">
          Suggested: tighten the 10K target by <strong>${f.suggested_tighten_sec_per_km} sec/km</strong>,
          then hold the new pace for 3 sessions before revisiting.
          <em>Not applied — change the target yourself if you agree.</em></p>
      </div>
    `;
  } else if (paceTarget.cooldown_remaining) {
    // The state he'll see most of the time, so it explains itself
    // rather than being a bare line of jargon.
    html += `
      <div class="sect" style="margin-top:0;">
        <div class="sect-h"><b>Prescribed paces</b><span>cooldown ${paceTarget.cooldown_remaining}</span></div>
        <p class="plain"><b>Nothing to change.</b> This watches whether your target paces have
          gone soft — two quality sessions inside ${esc(String(paceTarget.window_days))} days coming in 3+
          sec/km inside target <em>and</em> rated RPE 6 or easier. It flagged recently, so it is
          quiet for ${paceTarget.cooldown_remaining} more quality session${paceTarget.cooldown_remaining === 1 ? '' : 's'}
          while the tightened target gets tested.</p>
      </div>
    `;
  }

  if (today.plan_flag_reasons && today.plan_flag_reasons.length) {
    html += `
      <div style="background:var(--warn-bg); border:1px solid var(--warn); border-radius:8px; padding:12px 16px; margin-bottom:1.5rem;">
        <p style="font-size:13px; font-weight:500; color:var(--warn); margin:0 0 6px;">Worth reviewing today</p>
        ${today.plan_flag_reasons.map(r => `<p style="font-size:13px; color:var(--warn); margin:2px 0;">• ${r}</p>`).join('')}
      </div>
    `;
  }

  // The weeks AFTER this one. This week is already on screen above as
  // the lane, and a five-column table repeating it was both duplication
  // and unreadable on a phone — session notes are prose, and prose does
  // not belong in a 90px table column. Stacked rows instead: the line
  // you scan, then the note at full width underneath.
  const todayWeekStart = getWeekStart(today.date);
  const weekStarts = [1, 2].map(offset => {
    const d = new Date(todayWeekStart + 'T00:00:00');
    d.setDate(d.getDate() + offset * 7);
    return toDateStr(d);
  });

  weekStarts.forEach(weekStart => {
    const days = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(weekStart + 'T00:00:00');
      d.setDate(d.getDate() + i);
      days.push(toDateStr(d));
    }
    const weekKm = days.reduce((sum, ds) => {
      const s = planByDate[ds];
      return sum + ((s && s.target_distance_km) || 0);
    }, 0);

    // A week with nothing in it is one line, not seven empty rows. The
    // plan only runs as far as the last approved proposal, so future
    // weeks are routinely blank and should say so once.
    if (!days.some(ds => planByDate[ds])) {
      html += `
        <div class="sect">
          <div class="sect-h">
            <b>${esc(fmtWeekLabel(weekStart).replace('Week of ', ''))}</b><span>—</span>
          </div>
          <p style="font-size:13px; color:var(--text-muted); margin:0;">
            Nothing planned yet — written after the next weekly review.</p>
        </div>`;
      return;
    }

    html += `
      <div class="sect">
        <div class="sect-h">
          <b>${esc(fmtWeekLabel(weekStart).replace('Week of ', ''))}</b>
          <span>${weekKm ? weekKm.toFixed(0) + ' km' : ''}</span>
        </div>
        ${days.map(dateStr => {
          const s = planByDate[dateStr];
          const d = new Date(dateStr + 'T00:00:00');
          const dayName = d.toLocaleDateString('en-GB', { weekday: 'short' });
          return `
            <div style="border-bottom:1px solid var(--border); padding:8px 0;">
              <div style="display:flex; align-items:baseline; justify-content:space-between; gap:10px;">
                <span style="font-family:var(--mono); font-size:11px; color:var(--text-muted); min-width:66px;">${dayName} ${d.getDate()}</span>
                <span style="flex:1; font-size:14px; ${s ? 'text-transform:capitalize;' : 'color:var(--text-muted);'}">${s ? esc(s.session_type) : 'Nothing planned'}</span>
                <span style="font-family:var(--mono); font-size:14px; font-weight:600; white-space:nowrap;">${s && s.target_distance_km ? s.target_distance_km + ' km' : ''}</span>
              </div>
              ${s && s.target_pace ? `<p style="margin:4px 0 0 66px; font-family:var(--mono); font-size:11px; color:var(--club-blue);">${esc(s.target_pace)}</p>` : ''}
              ${s && s.notes ? `<p style="margin:5px 0 0 66px; font-size:12.5px; color:var(--text-secondary); line-height:1.45;">${esc(s.notes)}</p>` : ''}
            </div>`;
        }).join('')}
      </div>
    `;
  });

  // Flag history — only past events, most recent first
  if (flagsLog.length) {
    const sorted = [...flagsLog].sort((a, b) => b.date.localeCompare(a.date));
    html += `
      <div class="sect">
        <div class="sect-h"><b>Flag history</b><span>${sorted.length}</span></div>
        ${sorted.map(f => `
          <div style="border-bottom:1px solid var(--border); padding:8px 0;">
            <div style="display:flex; align-items:baseline; justify-content:space-between; gap:10px;">
              <span style="font-family:var(--mono); font-size:11px; color:var(--text-muted);">${fmtDayMonth(f.date)}</span>
              <span style="flex:1; font-size:13px; text-transform:capitalize;">${esc(f.planned_session ?? '--')}</span>
            </div>
            <p style="margin:4px 0 0; font-size:12.5px; color:var(--text-secondary); line-height:1.45;">${esc(f.reasons.join(' '))}</p>
          </div>`).join('')}
      </div>
    `;
  }

  panel.innerHTML = html;
}

// Race times carry hundredths from the projection maths; nobody needs
// to see them, and they imply a precision the model does not have.
function trimSecs(t) { return t ? t.replace(/\.\d+$/, '') : t; }

async function buildPredictorTab() {
  const panel = document.getElementById('tab-predictor');
  let pred;
  try {
    const res = await fetch('race_prediction.json?v=' + Date.now());
    if (!res.ok) throw new Error('not found');
    pred = await res.json();
  } catch (e) {
    panel.innerHTML = '<p class="error">race_prediction.json not found — run race_predictor.py first.</p>';
    return;
  }

  const distances = ['5K', '10K', 'Half Marathon', 'Marathon'];

  let nextRaceHtml = '';
  if (pred.next_race && pred.next_race.date) {
    const daysToRace = Math.ceil((new Date(pred.next_race.date) - new Date(pred.generated_date)) / 86400000);
    nextRaceHtml = `
      <div class="card" style="margin-bottom:1.5rem;">
        <p class="label">Next race</p>
        <p class="value" style="font-size:18px;">${pred.next_race.name || 'Unnamed race'}</p>
        <p class="delta flat">${fmtDate(pred.next_race.date)} — ${daysToRace} days away</p>
      </div>
    `;
  }

  const cardsHtml = distances.map(label => {
    const p = pred.predictions[label];
    if (!p || !p.predicted_time_fmt) {
      return `
        <div class="card">
          <p class="label">${label}</p>
          <p class="value" style="font-size:16px; color:var(--text-muted);">No data</p>
        </div>
      `;
    }
    return `
      <div class="card">
        <p class="label">${label}</p>
        <p class="value">${trimSecs(p.predicted_time_fmt)}</p>
        <p class="delta flat">${trimSecs(p.low_estimate_fmt)} - ${trimSecs(p.high_estimate_fmt)}</p>
      </div>
    `;
  }).join('');

  const notesHtml = distances.map(label => {
    const p = pred.predictions[label];
    if (!p || !p.note) return '';
    return `<p style="font-size:12px; color:var(--text-secondary); margin:4px 0;"><strong>${label}:</strong> ${p.note}</p>`;
  }).join('');

  // Training paces: what a session means when it says "10K effort" or
  // "threshold". Derived from the same race results as the predictions,
  // so it re-derives itself as fitness moves.
  const tp = pred.training_paces;
  const pacesHtml = tp ? `
    <div class="chart-card">
      <p class="title">Training paces — what the session names mean</p>
      ${tp.zones.map(z => `
        <div style="border-top:1px solid var(--border); padding:9px 0;">
          <div style="display:flex; justify-content:space-between; align-items:baseline; gap:12px;">
            <span style="font-size:14px;">${z.name}</span>
            <span style="font-size:15px; font-weight:600; color:var(--club-blue); white-space:nowrap;">${z.pace ?? '--'}</span>
          </div>
          <p style="font-size:12px; color:var(--text-secondary); margin:3px 0 0;">${z.purpose}</p>
        </div>
      `).join('')}
      <p style="font-size:12px; color:var(--text-muted); margin:10px 0 0; border-top:1px solid var(--border); padding-top:10px;">${tp.basis}</p>
      <p style="font-size:12px; color:var(--text-muted); margin:6px 0 0;">${tp.caveat}</p>
    </div>
  ` : '';

  panel.innerHTML = `
    ${nextRaceHtml}
    <div class="card-grid">
      ${cardsHtml}
    </div>
    ${pacesHtml}
    <div class="chart-card">
      <p class="title">Basis for these estimates</p>
      <p style="font-size:13px; color:var(--text-secondary); margin:0 0 10px;">${pred.vo2max_note}</p>
      <p style="font-size:13px; color:var(--text-secondary); margin:0 0 10px; border-top:1px solid var(--border); padding-top:10px;">
        Based on: ${pred.based_on_races.length ? pred.based_on_races.join(', ') : 'no clean races yet'}
      </p>
      ${pred.excluded_races && pred.excluded_races.length ? `
        <p style="font-size:12px; color:var(--text-muted); margin:8px 0 0;">
          Excluded: ${pred.excluded_races.map(r => `${r.name} (${r.reason})`).join('; ')}
        </p>

      ${notesHtml}
      ${pred.recent_key_sessions && pred.recent_key_sessions.length ? `
        <p style="font-size:13px; color:var(--text-muted); margin:10px 0 4px; border-top:1px solid var(--border); padding-top:10px;">

        </p>
