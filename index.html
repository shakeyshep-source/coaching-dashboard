<!--
  dashboard.html — DISPLAY LAYER

  Reads ONLY computed_data.json. Never reads garmin_data.json or
  manual_log.json directly, and never recalculates anything.
  If a number here is wrong, the bug is in build_computed.py, not here.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#2C6CB0">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131312">
<title>Coaching Dashboard</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  /* Theme: club yellow + blue carry identity and data series; green/
     amber/red are RESERVED for status (readiness, achilles, heat, ACWR
     zone) and never used decoratively. Dark palette steps validated
     separately against the dark surface — not an automatic flip. */
  :root {
    --bg: #F7F7F5;
    --surface: #FFFFFF;
    --border: #E5E5E3;
    --text-primary: #1A1A1A;
    --text-secondary: #4A4A4A;
    --text-muted: #6B7280;
    --club-blue: #2C6CB0;
    --club-yellow: #D4A800;
    --club-yellow-bright: #F5C518;
    --good: #2E7D32;      --good-bg: #EAF4EA;
    --warn: #B45309;      --warn-bg: #FCF1E3;
    --bad:  #A83232;      --bad-bg:  #F9ECEC;
    --grid: #E5E5E3;
    --tick: #6B7280;
    /* legacy aliases used by older markup */
    --yellow: var(--club-yellow-bright);
    --yellow-text: #A88400;
    --blue: var(--club-blue);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131312;
      --surface: #1E1E1C;
      --border: #33332F;
      --text-primary: #ECECEA;
      --text-secondary: #C2C2BE;
      --text-muted: #8B8B86;
      --club-blue: #4A8CC8;
      --club-yellow: #AE922C;
      --club-yellow-bright: #C9A93B;
      --good: #6CBB72;      --good-bg: #1E2C1F;
      --warn: #D89A50;      --warn-bg: #302518;
      --bad:  #D97070;      --bad-bg:  #321D1D;
      --grid: #2C2C29;
      --tick: #8B8B86;
      --yellow-text: #C9A93B;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 1.5rem;
    padding-top: calc(1.5rem + 4px);
    font-variant-numeric: tabular-nums;
  }
  /* Club identity: a thin blue->yellow bar across the very top */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--club-blue) 0%, var(--club-blue) 55%, var(--club-yellow-bright) 55%, var(--club-yellow-bright) 100%);
    z-index: 10;
  }

  /* Hero briefing */
  .hero {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem;
    margin-bottom: 1rem;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .hero .session { font-size: 20px; font-weight: 600; margin: 2px 0 2px; }
  .hero .session .stype { text-transform: capitalize; }
  .hero .session-notes { font-size: 13px; color: var(--text-secondary); margin: 0 0 10px; }
  .readiness {
    display: flex; align-items: flex-start; gap: 8px;
    border-radius: 8px; padding: 10px 12px;
    font-size: 13px;
  }
  .readiness.good    { background: var(--good-bg); color: var(--good); }
  .readiness.caution { background: var(--warn-bg); color: var(--warn); }
  .readiness.flag    { background: var(--bad-bg);  color: var(--bad); }
  .readiness .icon { font-size: 14px; line-height: 1.4; }
  .chip {
    display: inline-block; font-size: 12px; border-radius: 999px;
    padding: 2px 10px; margin: 8px 6px 0 0;
    background: var(--bg); border: 1px solid var(--border); color: var(--text-secondary);
  }
  .chip.warn { background: var(--warn-bg); border-color: transparent; color: var(--warn); }
  .chip.bad  { background: var(--bad-bg);  border-color: transparent; color: var(--bad); }

  .spark-wrap { height: 34px; margin-top: 6px; position: relative; }
  .header { margin-bottom: 1.25rem; }
  .header .eyebrow { font-size: 13px; color: var(--text-muted); margin: 0; }
  .header h1 { font-size: 22px; font-weight: 500; margin: 4px 0 0; }
  .header .sub { font-size: 13px; color: var(--text-secondary); margin: 2px 0 0; }

  .summary-strip {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    margin: 1.25rem 0;
    font-size: 14px;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .summary-strip .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--yellow); flex-shrink: 0;
  }

  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 1.5rem;
  }
  .card {
    background: var(--surface);
    border-radius: 8px;
    padding: 1rem;
    border: 1px solid var(--border);
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .card .label { font-size: 13px; color: var(--text-muted); margin: 0 0 4px; }
  .card .value { font-size: 24px; font-weight: 500; margin: 0; }
  .card .delta { font-size: 12px; margin: 4px 0 0; }
  /* Delta chips are semantic: direction alone isn't good or bad — the
     metric decides (HRV up = good, RHR up = worth noting). Arrow glyphs
     carry the direction so colour is never the only signal. */
  .delta.good { color: var(--good); }
  .delta.warn { color: var(--warn); }
  .delta.up { color: var(--yellow-text); }
  .delta.down { color: var(--blue); }
  .delta.flat { color: var(--text-muted); }

  .chart-card {
    background: var(--surface);
    border-radius: 12px;
    padding: 1rem;
    margin-bottom: 1rem;
    border: 1px solid var(--border);
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .chart-card .title { font-size: 13px; color: var(--text-muted); margin: 0 0 12px; }
  .chart-wrap { position: relative; height: 220px; }

  .error {
    background: var(--bad-bg);
    border: 1px solid var(--bad);
    color: var(--bad);
    padding: 1rem;
    border-radius: 8px;
    font-size: 14px;
  }

  .tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 1.25rem;
    position: sticky;
    top: 4px;
    background: var(--bg);
    z-index: 5;
  }
  .tab-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 14px;
    padding: 8px 14px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  .tab-btn.active {
    color: var(--text-primary);
    border-bottom-color: var(--blue);
  }
  .tab-panel { display: none; }
</style>
</head>
<body>

  <div class="header">
    <p class="eyebrow">Garmin + Open-Meteo</p>
    <h1>Coaching dashboard</h1>
    <p class="sub" id="dateLabel">Loading...</p>
  </div>

  <div style="display:flex; gap:16px; flex-wrap:wrap; margin-bottom:1.25rem;" id="formLinks"></div>

  <div class="tabs" style="flex-wrap:wrap;">
    <button class="tab-btn active" data-tab="overview">Overview</button>
    <button class="tab-btn" data-tab="coach">Coach</button>
    <button class="tab-btn" data-tab="acwr">ACWR</button>
    <button class="tab-btn" data-tab="plan">Plan</button>
    <button class="tab-btn" data-tab="performance">Performance</button>
    <button class="tab-btn" data-tab="predictor">Predictor</button>
    <button class="tab-btn" data-tab="races">Races</button>
  </div>

  <div id="content">
    <p class="error" style="display:none;" id="errorBox"></p>
  </div>

  <div id="tab-coach" class="tab-panel" style="display:none;"></div>
  <div id="tab-acwr" class="tab-panel" style="display:none;"></div>
  <div id="tab-plan" class="tab-panel" style="display:none;"></div>
  <div id="tab-performance" class="tab-panel" style="display:none;"></div>
  <div id="tab-predictor" class="tab-panel" style="display:none;"></div>
  <div id="tab-races" class="tab-panel" style="display:none;"></div>

<script>
// If the Chart.js CDN is unreachable (offline PWA, network blip), stub
// it out so cards, tables and the coach review still render — losing
// the charts must never blank the whole dashboard.
if (typeof Chart === 'undefined') window.Chart = class { constructor() {} };

// Chart colours come from the CSS theme so light/dark stay in sync.
// Values are read once at load; if the OS theme flips mid-session the
// next reload picks it up (matchMedia listener below forces that).
function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}
const THEME = {};
function loadTheme() {
  THEME.blue = cssVar('--club-blue');
  THEME.yellow = cssVar('--club-yellow');
  THEME.good = cssVar('--good');
  THEME.warn = cssVar('--warn');
  THEME.bad = cssVar('--bad');
  THEME.grid = cssVar('--grid');
  THEME.tick = cssVar('--tick');
  THEME.ink = cssVar('--text-primary');
  THEME.muted = cssVar('--text-muted');
}
loadTheme();
if (window.matchMedia) {
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => location.reload());
}
function axisXY(opts = {}) {
  return {
    y: Object.assign({ ticks: { color: THEME.tick }, grid: { color: THEME.grid } }, opts.y || {}),
    x: Object.assign({ ticks: { color: THEME.tick }, grid: { display: false } }, opts.x || {}),
  };
}

// Shades a horizontal band (e.g. the ACWR 0.8-1.3 safe zone) behind the
// data so "in the zone" is visible without remembering the range.
const bandPlugin = {
  id: 'band',
  beforeDatasetsDraw(chart, args, opts) {
    if (!opts || opts.min == null) return;
    const { ctx, chartArea, scales } = chart;
    if (!chartArea || !scales.y) return;
    const top = scales.y.getPixelForValue(opts.max);
    const bottom = scales.y.getPixelForValue(opts.min);
    ctx.save();
    ctx.fillStyle = opts.color;
    ctx.fillRect(chartArea.left, top, chartArea.right - chartArea.left, bottom - top);
    ctx.restore();
  },
};

// Tiny axis-less trend line inside a stat card.
function sparkline(canvasId, values, color) {
  const el = document.getElementById(canvasId);
  if (!el) return;
  new Chart(el, {
    type: 'line',
    data: {
      labels: values.map((_, i) => i),
      datasets: [{ data: values, borderColor: color, borderWidth: 2, pointRadius: 0, tension: 0.35, spanGaps: true }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: { x: { display: false }, y: { display: false } },
      plugins: { legend: { display: false }, tooltip: { enabled: false } },
      animation: false,
    },
  });
}

// Semantic delta chip: the metric decides whether "up" is good.
function deltaChip(delta, unit, upIsGood) {
  if (delta === null || delta === undefined) return '<p class="delta flat">—</p>';
  const arrow = delta > 0.5 ? '▲' : delta < -0.5 ? '▼' : '●';
  let cls = 'flat';
  if (Math.abs(delta) > 0.5) {
    const isGood = (delta > 0) === upIsGood;
    cls = isGood ? 'good' : 'warn';
  }
  const sign = delta > 0 ? '+' : '';
  return `<p class="delta ${cls}">${arrow} ${sign}${delta}${unit} vs 7d</p>`;
}

// UK-format date display helpers. Internal data stays ISO (YYYY-MM-DD)
// everywhere — these are for what the eye reads, nothing else.
function fmtDayMonth(dateStr) {          // "29 Jul"
  if (!dateStr) return '--';
  return new Date(dateStr + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}
function fmtDate(dateStr) {              // "29 Jul 2026"
  if (!dateStr) return '--';
  return new Date(dateStr + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}

// Fill-in URL of the daily log Google Form — powers the "Log today's
// session" button in the hero. The watch supplies distance, pace and HR;
// this form carries the things only Shep knows: achilles, RPE, and what
// the session actually felt like.
const DAILY_FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSe7Bnpz45kGDxRVz8KQKbb-B9-7j7ThcAul5xJbVWftQTHL6A/viewform';
const PLAN_FORM_URL  = 'https://docs.google.com/forms/d/e/1FAIpQLSfnpMureLGUjyN_6NG48_ruoC4twGbw6SGsUNH8HpP5G_3oDg/viewform';
const RACE_FORM_URL  = 'https://docs.google.com/forms/d/e/1FAIpQLSeyiW4JbXtwu1pNrYdwGJzQTpDO_oaVP4idEzRbarEwY7XQ2Q/viewform';

// Fill-in URL of the "Weekly review response" Google Form — powers the
// Respond button on the Coach tab. See AUTOMATION_SETUP.md step 2.
const REVIEW_FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSelVvuccMxIiMpIy9vjmGPHJjjV4mwHOB4ReQH0uel8d2PGcA/viewform';

async function loadDashboard() {
  const content = document.getElementById('content');
  const errorBox = document.getElementById('errorBox');

  let data;
  try {
    const res = await fetch('computed_data.json?v=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    data = await res.json();
  } catch (err) {
    errorBox.style.display = 'block';
    errorBox.textContent = 'Could not load computed_data.json: ' + err.message;
    return;
  }

  if (!Array.isArray(data) || data.length === 0) {
    errorBox.style.display = 'block';
    errorBox.textContent = 'computed_data.json loaded but contained no rows.';
    return;
  }

  data.sort((a, b) => a.date.localeCompare(b.date));
  const today = data[data.length - 1];

  document.getElementById('dateLabel').textContent =
    new Date(today.date + 'T00:00:00').toLocaleDateString('en-GB',
      { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

  // Today's planned session for the hero briefing
  let todayPlan = null;
  try {
    const planRes = await fetch('training_plan.json?v=' + Date.now());
    if (planRes.ok) {
      const plan = await planRes.json();
      todayPlan = plan.find(s => s.date === today.date) || null;
    }
  } catch (e) { /* hero renders without the session */ }

  // Has today been logged? achilles_score is the field the form always
  // carries, so its presence is the reliable "logged" signal. Nudge only
  // when it's missing — a silent dashboard is how two weeks of logging
  // quietly disappeared once already.
  const loggedToday = today.achilles_score !== null && today.achilles_score !== undefined;
  const logStripHtml = loggedToday
    ? `<p style="font-size:12px; color:var(--good); margin:10px 0 0;">✓ Today's session logged</p>`
    : (DAILY_FORM_URL
        ? `<a href="${DAILY_FORM_URL}" rel="noopener" style="display:inline-block; margin-top:12px; background:var(--club-blue); color:#fff; font-size:13px; font-weight:500; padding:9px 16px; border-radius:8px; text-decoration:none;">Log today's session</a>`
        : `<p style="font-size:12px; color:var(--text-muted); margin:10px 0 0;">Not logged today — set DAILY_FORM_URL in index.html for a one-tap button here.</p>`);

  const level = today.readiness_level || 'good';
  const levelIcon = { good: '✓', caution: '△', flag: '✕' }[level] || '✓';
  const heatChip = today.heat_risk === 'high'
    ? '<span class="chip bad">Heat risk high</span>'
    : today.heat_risk === 'moderate' ? '<span class="chip warn">Heat moderate</span>' : '';

  content.innerHTML = `
    <div class="hero">
      <p class="label" style="font-size:13px; color:var(--text-muted); margin:0;">Today's session</p>
      <p class="session"><span class="stype">${todayPlan ? todayPlan.session_type : 'Nothing planned'}</span>${todayPlan && todayPlan.target_distance_km ? ` — ${todayPlan.target_distance_km} km` : ''}</p>
      ${todayPlan && todayPlan.notes ? `<p class="session-notes">${todayPlan.notes}</p>` : ''}
      <div class="readiness ${level}">
        <span class="icon">${levelIcon}</span>
        <span>${today.today_summary || 'No readiness data yet.'}</span>
      </div>
      <div>
        ${heatChip}
        ${today.achilles_score >= 3 ? `<span class="chip bad">Achilles ${today.achilles_score}/10</span>` : ''}
        ${(today.recovery_confounders || []).map(c =>
          `<span class="chip">${c} noted</span>`).join('')}
        ${today.acwr ? `<span class="chip">ACWR ${today.acwr}${today.acwr_status ? ' · ' + today.acwr_status.toLowerCase() : ''}</span>` : ''}
      </div>
      ${logStripHtml}
    </div>

    <div class="card-grid">
      <div class="card">
        <p class="label">RHR</p>
        <p class="value">${today.rhr ?? '--'}<span style="font-size:13px; color:var(--text-muted);"> bpm</span></p>
        ${deltaChip(today.rhr_delta_from_baseline, ' bpm', false)}
        <div class="spark-wrap"><canvas id="sparkRhr"></canvas></div>
      </div>
      <div class="card">
        <p class="label">HRV</p>
        <p class="value">${today.hrv_last_night ?? '--'}<span style="font-size:13px; color:var(--text-muted);"> ms</span></p>
        ${deltaChip(today.hrv_delta_from_baseline, ' ms', true)}
        <div class="spark-wrap"><canvas id="sparkHrv"></canvas></div>
      </div>
      <div class="card">
        <p class="label">Sleep score</p>
        <p class="value">${today.sleep_score ?? '--'}</p>
        <p class="delta flat">${today.sleep_duration_hrs ? today.sleep_duration_hrs + ' hrs' : ''}</p>
        <div class="spark-wrap"><canvas id="sparkSleep"></canvas></div>
      </div>
      <div class="card">
        <p class="label">Body battery</p>
        <p class="value">${today.body_battery_high ?? '--'}</p>
        <p class="delta flat">peak</p>
        <div class="spark-wrap"><canvas id="sparkBb"></canvas></div>
      </div>
    </div>

    <div class="chart-card">
      <p class="title">HRV — 14 days (dashed = 7-day baseline)</p>
      <div class="chart-wrap" style="height:160px;"><canvas id="hrvChart"></canvas></div>
    </div>

    <div class="chart-card">
      <p class="title">RHR — 14 days (dashed = 7-day baseline)</p>
      <div class="chart-wrap" style="height:160px;"><canvas id="rhrChart"></canvas></div>
    </div>

    <div class="chart-card">
      <p class="title">Sleep score &amp; body battery</p>
      <div class="chart-wrap" style="height:180px;"><canvas id="sleepBbChart"></canvas></div>
    </div>

    <div class="chart-card">
      <p class="title">Achilles score (0 = no issue, 10 = severe)</p>
      <div class="chart-wrap" style="height:160px;"><canvas id="achillesChart"></canvas></div>
    </div>

    <div class="chart-card" id="planCard" style="display:none;">
      <p class="title">Upcoming sessions</p>
      <table style="width:100%; border-collapse:collapse; font-size:13px;">
        <thead>
          <tr style="text-align:left; color:var(--text-muted);">
            <th style="padding:6px 8px;">Date</th><th style="padding:6px 8px;">Type</th>
            <th style="padding:6px 8px;">Distance</th><th style="padding:6px 8px;">Pace</th>
          </tr>
        </thead>
        <tbody id="planRows"></tbody>
      </table>
    </div>
  `;

  const labels = data.map(r => fmtDayMonth(r.date));

  sparkline('sparkRhr', data.map(r => r.rhr), THEME.blue);
  sparkline('sparkHrv', data.map(r => r.hrv_last_night), THEME.blue);
  sparkline('sparkSleep', data.map(r => r.sleep_score), THEME.blue);
  sparkline('sparkBb', data.map(r => r.body_battery_high), THEME.blue);

  // One metric per chart, own scale, with its 7-day baseline dashed —
  // never two scales on one plot.
  function metricChart(canvasId, series, baseline, color) {
    new Chart(document.getElementById(canvasId), {
      type: 'line',
      data: {
        labels,
        datasets: [
          { label: 'daily', data: series, borderColor: color, backgroundColor: color, borderWidth: 2, tension: 0.3, spanGaps: true, pointRadius: 2 },
          { label: '7d baseline', data: baseline, borderColor: THEME.muted, borderDash: [5, 4], borderWidth: 1.5, pointRadius: 0, spanGaps: true },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: axisXY(),
        plugins: { legend: { display: false } },
      },
    });
  }
  metricChart('hrvChart', data.map(r => r.hrv_last_night), data.map(r => r.hrv_baseline_7d), THEME.blue);
  metricChart('rhrChart', data.map(r => r.rhr), data.map(r => r.rhr_baseline_7d), THEME.yellow);

  // Sleep + body battery share one genuine 0-100 scale, so one chart is fine.
  new Chart(document.getElementById('sleepBbChart'), {
    type: 'line',
    data: {
      labels,
      datasets: [
        { label: 'Sleep score', data: data.map(r => r.sleep_score), borderColor: THEME.blue, backgroundColor: THEME.blue, borderWidth: 2, tension: 0.3, spanGaps: true, pointRadius: 2 },
        { label: 'Body battery', data: data.map(r => r.body_battery_high), borderColor: THEME.yellow, backgroundColor: THEME.yellow, borderWidth: 2, tension: 0.3, spanGaps: true, pointRadius: 2 },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: axisXY({ y: { min: 0, max: 100 } }),
      plugins: { legend: { labels: { color: THEME.ink } } },
    },
  });

  // Achilles is a status metric — it wears the status colour.
  new Chart(document.getElementById('achillesChart'), {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: 'Achilles (0-10)',
        data: data.map(r => r.achilles_score),
        borderColor: THEME.bad,
        backgroundColor: THEME.bad,
        borderWidth: 2,
        tension: 0.2,
        spanGaps: true,
        pointRadius: 4,
      }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: axisXY({ y: { min: 0, max: 10, ticks: { color: THEME.tick, stepSize: 2 } } }),
      plugins: { legend: { display: false } },
    },
  });

  setupTabs(data);
  return data;
}

function setupTabs(data) {
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.style.display = 'none');
      document.getElementById('content').style.display = 'none';

      btn.classList.add('active');
      const tab = btn.dataset.tab;
      if (tab === 'overview') {
        document.getElementById('content').style.display = 'block';
      } else {
        document.getElementById('tab-' + tab).style.display = 'block';
      }
    });
  });

  buildCoachTab();
  buildAcwrTab(data);
  buildPlanTab(data);
  buildPerformanceTab(data);
  buildPredictorTab();
  buildRacesTab();
}

const esc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

// Minimal markdown renderer for the weekly review — headings, bold,
// bullets, paragraphs. Content is coach-authored, but escape anyway.
function renderMd(md) {
  return esc(md).split(/\n{2,}/).map(block => {
    const lines = block.split('\n');
    if (lines.every(l => /^\s*[-*] /.test(l))) {
      return '<ul style="margin:8px 0; padding-left:20px;">' +
        lines.map(l => `<li style="font-size:13px; color:var(--text-secondary); margin:3px 0;">${inline(l.replace(/^\s*[-*] /, ''))}</li>`).join('') +
        '</ul>';
    }
    const h = block.match(/^(#{1,4}) (.*)$/);
    if (h) return `<p style="font-size:14px; font-weight:600; margin:14px 0 4px;">${inline(h[2])}</p>`;
    return `<p style="font-size:13px; color:var(--text-secondary); margin:8px 0; line-height:1.5;">${inline(block.replace(/\n/g, '<br>'))}</p>`;
  }).join('');
  function inline(s) {
    return s.replace(/\*\*(.+?)\*\*/g, '<strong style="color:var(--text-primary);">$1</strong>');
  }
}

async function fetchJson(name) {
  try {
    const res = await fetch(name + '?v=' + Date.now());
    if (!res.ok) return null;
    return await res.json();
  } catch (e) { return null; }
}

function toDateStr(d) {
  // Always use LOCAL date components, never toISOString() — that
  // converts to UTC and silently shifts dates back a day whenever
  // the local timezone is ahead of UTC (e.g. UK on BST).
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function getWeekStart(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const day = d.getDay(); // 0=Sun, 1=Mon...
  const diff = day === 0 ? -6 : 1 - day; // shift to Monday
  d.setDate(d.getDate() + diff);
  return toDateStr(d);
}

function fmtWeekLabel(weekStartStr) {
  const start = new Date(weekStartStr + 'T00:00:00');
  const end = new Date(start);
  end.setDate(end.getDate() + 6);
  const fmt = d => d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  return `Week of ${fmt(start)} - ${fmt(end)}`;
}

  if (today.plan_flag_reasons && today.plan_flag_reasons.length) {
    html += `
      <div style="background:var(--warn-bg); border:1px solid var(--warn); border-radius:8px; padding:12px 16px; margin-bottom:1.5rem;">
        <p style="font-size:13px; font-weight:500; color:var(--warn); margin:0 0 6px;">Worth reviewing today</p>
        ${today.plan_flag_reasons.map(r => `<p style="font-size:13px; color:var(--warn); margin:2px 0;">• ${r}</p>`).join('')}
      </div>
    `;
  }

  // Build full 7-day weeks: this week + next 2 weeks, showing every day
  // (with or without a planned session), not just days that have entries.
  const todayWeekStart = getWeekStart(today.date);
  const weekStarts = [0, 1, 2].map(offset => {
    const d = new Date(todayWeekStart + 'T00:00:00');
    d.setDate(d.getDate() + offset * 7);
    return toDateStr(d);
  });

  weekStarts.forEach(weekStart => {
    const days = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(weekStart + 'T00:00:00');
      d.setDate(d.getDate() + i);
      days.push(toDateStr(d));
    }

    html += `
      <div class="chart-card">
        <p class="title">${fmtWeekLabel(weekStart)}</p>
        <table style="width:100%; border-collapse:collapse; font-size:13px;">
          <thead>
            <tr style="text-align:left; color:var(--text-muted);">
              <th style="padding:6px 8px;">Date</th><th style="padding:6px 8px;">Type</th>
              <th style="padding:6px 8px;">Distance</th><th style="padding:6px 8px;">Pace</th>
              <th style="padding:6px 8px;">Notes</th>
            </tr>
          </thead>
          <tbody>
            ${days.map(dateStr => {
              const s = planByDate[dateStr];
              const isToday = dateStr === today.date;
              const dayName = new Date(dateStr + 'T00:00:00').toLocaleDateString('en-GB', { weekday: 'short' });
              return `
                <tr style="border-top:1px solid var(--border); ${isToday ? 'background:color-mix(in srgb, var(--club-yellow) 10%, transparent);' : ''}">
                  <td style="padding:6px 8px;">${dayName} ${fmtDayMonth(dateStr)}${isToday ? ' (today)' : ''}</td>
                  <td style="padding:6px 8px; text-transform:capitalize; ${!s ? 'color:var(--text-muted);' : ''}">${s ? s.session_type : 'Nothing planned'}</td>
                  <td style="padding:6px 8px;">${s && s.target_distance_km ? s.target_distance_km + ' km' : '--'}</td>
                  <td style="padding:6px 8px;">${s && s.target_pace ? s.target_pace : '--'}</td>
                  <td style="padding:6px 8px; color:var(--text-secondary);">${s && s.notes ? s.notes : ''}</td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      </div>
    `;
  });

  // Flag history — only past events, most recent first
  if (flagsLog.length) {
    const sorted = [...flagsLog].sort((a, b) => b.date.localeCompare(a.date));
    html += `
      <div class="chart-card">
        <p class="title">Flag history</p>
        <table style="width:100%; border-collapse:collapse; font-size:13px;">
          <thead>
            <tr style="text-align:left; color:var(--text-muted);">
              <th style="padding:6px 8px;">Date</th><th style="padding:6px 8px;">Planned</th><th style="padding:6px 8px;">Reasons</th>
            </tr>
          </thead>
          <tbody>
            ${sorted.map(f => `
              <tr style="border-top:1px solid var(--border);">
                <td style="padding:6px 8px;">${fmtDate(f.date)}</td>
                <td style="padding:6px 8px; text-transform:capitalize;">${f.planned_session ?? '--'}</td>
                <td style="padding:6px 8px; color:var(--text-secondary);">${f.reasons.join(' ')}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  }

  panel.innerHTML = html;
}

// Race times carry hundredths from the projection maths; nobody needs
// to see them, and they imply a precision the model does not have.
function trimSecs(t) { return t ? t.replace(/\.\d+$/, '') : t; }

async function buildPredictorTab() {
  const panel = document.getElementById('tab-predictor');
  let pred;
  try {
    const res = await fetch('race_prediction.json?v=' + Date.now());
    if (!res.ok) throw new Error('not found');
    pred = await res.json();
  } catch (e) {
    panel.innerHTML = '<p class="error">race_prediction.json not found — run race_predictor.py first.</p>';
    return;
  }

  const distances = ['5K', '10K', 'Half Marathon', 'Marathon'];

  let nextRaceHtml = '';
  if (pred.next_race && pred.next_race.date) {
    const daysToRace = Math.ceil((new Date(pred.next_race.date) - new Date(pred.generated_date)) / 86400000);
    nextRaceHtml = `
      <div class="card" style="margin-bottom:1.5rem;">
        <p class="label">Next race</p>
        <p class="value" style="font-size:18px;">${pred.next_race.name || 'Unnamed race'}</p>
        <p class="delta flat">${fmtDate(pred.next_race.date)} — ${daysToRace} days away</p>
      </div>
    `;
  }

  const cardsHtml = distances.map(label => {
    const p = pred.predictions[label];
    if (!p || !p.predicted_time_fmt) {
      return `
        <div class="card">
          <p class="label">${label}</p>
          <p class="value" style="font-size:16px; color:var(--text-muted);">No data</p>
        </div>
      `;
    }
    return `
      <div class="card">
        <p class="label">${label}</p>
        <p class="value">${trimSecs(p.predicted_time_fmt)}</p>
        <p class="delta flat">${trimSecs(p.low_estimate_fmt)} - ${trimSecs(p.high_estimate_fmt)}</p>
      </div>
    `;
  }).join('');

  const notesHtml = distances.map(label => {
    const p = pred.predictions[label];
    if (!p || !p.note) return '';
    return `<p style="font-size:12px; color:var(--text-secondary); margin:4px 0;"><strong>${label}:</strong> ${p.note}</p>`;
  }).join('');

  // Training paces: what a session means when it says "10K effort" or
  // "threshold". Derived from the same race results as the predictions,
  // so it re-derives itself as fitness moves.
  const tp = pred.training_paces;
  const pacesHtml = tp ? `
    <div class="chart-card">
      <p class="title">Training paces — what the session names mean</p>
      ${tp.zones.map(z => `
        <div style="border-top:1px solid var(--border); padding:9px 0;">
          <div style="display:flex; justify-content:space-between; align-items:baseline; gap:12px;">
            <span style="font-size:14px;">${z.name}</span>
            <span style="font-size:15px; font-weight:600; color:var(--club-blue); white-space:nowrap;">${z.pace ?? '--'}</span>
          </div>
          <p style="font-size:12px; color:var(--text-secondary); margin:3px 0 0;">${z.purpose}</p>
        </div>
      `).join('')}
      <p style="font-size:12px; color:var(--text-muted); margin:10px 0 0; border-top:1px solid var(--border); padding-top:10px;">${tp.basis}</p>
      <p style="font-size:12px; color:var(--text-muted); margin:6px 0 0;">${tp.caveat}</p>
    </div>
  ` : '';

  panel.innerHTML = `
    ${nextRaceHtml}
    <div class="card-grid">
      ${cardsHtml}
    </div>
    ${pacesHtml}
    <div class="chart-card">
      <p class="title">Basis for these estimates</p>
      <p style="font-size:13px; color:var(--text-secondary); margin:0 0 10px;">${pred.vo2max_note}</p>
      <p style="font-size:13px; color:var(--text-secondary); margin:0 0 10px; border-top:1px solid var(--border); padding-top:10px;">
        Based on: ${pred.based_on_races.length ? pred.based_on_races.join(', ') : 'no clean races yet'}
      </p>
      ${pred.excluded_races && pred.excluded_races.length ? `
        <p style="font-size:12px; color:var(--text-muted); margin:8px 0 0;">
          Excluded: ${pred.excluded_races.map(r => `${r.name} (${r.reason})`).join('; ')}
        </p>
      ` : ''}
      ${notesHtml}
      ${pred.recent_key_sessions && pred.recent_key_sessions.length ? `
        <p style="font-size:13px; color:var(--text-muted); margin:10px 0 4px; border-top:1px solid var(--border); padding-top:10px;">
          Recent key sessions (for reference — not converted into a predicted time):
        </p>
        ${pred.recent_key_sessions.map(s => `
          <p style="font-size:13px; color:var(--text-secondary); margin:2px 0;">${fmtDate(s.date)}: ${s.description}</p>
        `).join('')}
      ` : ''}
    </div>
  `;
}

// Recovery days per quality session, with a rolling average over the
// last three. The individual bars are noisy — heat, a late night, a hard
// week all move them — so the dashed line is the thing to actually read.
// Sessions that never came back inside the 7-day window are drawn at the
// ceiling in the alert colour rather than dropped, since silently hiding
// the worst results would defeat the point.

// Aerobic decoupling: how much pace costs late in a run versus early.
// Under 5% is Friel's "the aerobic system held". Unreliable runs (hills,
// quality sessions) are drawn hollow rather than hidden — excluding them
// silently would flatter the line.
function drawEfficiencyChart(eff) {
  const el = document.getElementById('efficiencyChart');
  const months = (eff && eff.months) || [];
  if (!el || months.length < 2) return;
  new Chart(el, {
    type: 'line',
    data: {
      labels: months.map(m => m.month),
      datasets: [{
        label: 'm/min per bpm',
        data: months.map(m => m.efficiency),
        borderColor: THEME.blue,
        backgroundColor: THEME.blue,
        borderWidth: 2,
        tension: 0.3,
        pointRadius: 4,
      }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: axisXY({
        y: { ticks: { color: THEME.tick } },
        x: { ticks: { color: THEME.tick, maxTicksLimit: 12 } },
      }),
      plugins: { legend: { display: false } },
    },
  });
}

function drawDecouplingChart(dec) {
  const el = document.getElementById('decouplingChart');
  if (!el || !dec || !dec.runs || !dec.runs.length) return;
  const runs = dec.runs.slice(-14);
  const clean = runs.map(r => !r.unreliable_reasons.length);
  const values = runs.map(r => r.decoupling_pct);
  const threshold = dec.threshold_pct || 5;

  new Chart(el, {
    plugins: [bandPlugin],
    data: {
      labels: runs.map(r => fmtDayMonth(r.date)),
      datasets: [{
        type: 'bar',
        label: 'Decoupling %',
        data: values,
        backgroundColor: runs.map((r, i) => !clean[i] ? 'rgba(127,127,127,0.28)'
          : r.decoupling_pct <= threshold ? THEME.blue : THEME.warn),
        borderRadius: 4,
      }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: axisXY({
        y: { ticks: { color: THEME.tick }, title: { display: false } },
        x: { ticks: { color: THEME.tick, maxTicksLimit: 8 } },
      }),
      plugins: {
        legend: { display: false },
        band: { min: -100, max: threshold, color: 'rgba(46, 125, 50, 0.10)' },
      },
    },
  });
}

function drawRecoveryChart(rec) {
  const el = document.getElementById('recoveryChart');
  if (!el || !rec || !rec.sessions.length) return;
  const sessions = rec.sessions.slice(-12);
  const cap = rec.window_days || 7;
  const values = sessions.map(s => s.recovery_days === null ? cap : s.recovery_days);
  const capped = sessions.map(s => s.recovery_days === null);

  // Rolling mean of the last three, so a single bad session doesn't read
  // as a trend. Capped sessions count as the ceiling — a floor on how bad
  // they were, which is better than excluding them and flattering the line.
  const rolling = values.map((_, i) => {
    if (i < 2) return null;
    const w = values.slice(i - 2, i + 1);
    return Math.round((w.reduce((a, b) => a + b, 0) / w.length) * 10) / 10;
  });

  new Chart(el, {
    plugins: [bandPlugin],
    data: {
      labels: sessions.map(s => fmtDayMonth(s.date)),
      datasets: [
        {
          type: 'bar',
          label: 'Days to recover',
          data: values,
          backgroundColor: capped.map(c => c ? THEME.bad : THEME.blue),
          borderRadius: 4,
        },
        {
          type: 'line',
          label: 'Rolling average (3 sessions)',
          data: rolling,
          borderColor: THEME.yellow,
          borderDash: [6, 4],
          borderWidth: 2,
          pointRadius: 0,
          spanGaps: true,
        },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: axisXY({
        y: { min: 0, max: cap, ticks: { color: THEME.tick, stepSize: 1 } },
        x: { ticks: { color: THEME.tick, maxTicksLimit: 8 } },
      }),
      plugins: {
        legend: { labels: { color: THEME.ink, boxWidth: 12, font: { size: 11 } } },
        // Shading the quick-turnaround zone means "is this good?" is
        // answered by where the bar sits, not by remembering a threshold.
        band: { min: 0, max: 2, color: 'rgba(46, 125, 50, 0.10)' },
      },
    },
  });
}

async function buildPerformanceTab(data) {
  const panel = document.getElementById('tab-performance');
  const [rec, detail, dec, eff] = await Promise.all([
    fetchJson('recovery_log.json'),
    fetchJson('session_detail.json'),
    fetchJson('decoupling.json'),
    fetchJson('efficiency_history.json'),
  ]);
  const today = data[data.length - 1];
  // Prefer the long series (vo2max_history.json, weekly back to January)
  // over the 14-day computed window — VO2max moves over months, and a
  // fortnight of it says nothing.
  const vo2Long = await fetchJson('vo2max_history.json');
  const vo2Rows = (vo2Long && vo2Long.length >= 2)
    ? vo2Long
    : data.filter(r => r.vo2max);
  const latestVo2 = vo2Rows.length ? vo2Rows[vo2Rows.length - 1] : null;

  // Days for HRV and RHR to return to where they sat BEFORE a quality
  // session. The number itself matters less than which way it moves over
  // months — lengthening recovery shows up before soreness does.
  const measured = ((rec && rec.sessions) || []).filter(s => s.recovery_days !== null);
  const trendColour = !rec || !rec.trend ? 'var(--text-muted)'
    : rec.trend.direction.startsWith('lengthening') ? 'var(--warn)'
    : rec.trend.direction.startsWith('shortening') ? 'var(--good)' : 'var(--text-secondary)';
  const recoveryHtml = !rec || !rec.sessions.length ? '' : `
    <div class="chart-card">
      <p class="title">Recovery after quality sessions — days back to pre-session normal</p>
      ${rec.trend ? `
        <p style="font-size:14px; margin:0 0 4px;">
          Recent average <strong>${rec.trend.recent_avg_days} days</strong>${rec.trend.prior_avg_days != null ? `, previously ${rec.trend.prior_avg_days}` : ''}
        </p>
        <p style="font-size:13px; color:${trendColour}; margin:0 0 10px;">${rec.trend.direction}</p>
      ` : `
        <p style="font-size:13px; color:var(--text-muted); margin:0 0 10px;">
          ${measured.length} session${measured.length === 1 ? '' : 's'} measured so far — a trend needs four.
          This one is built to be read over months, not weeks.
        </p>
      `}
      <div class="chart-wrap" style="height:190px; margin-bottom:6px;"><canvas id="recoveryChart"></canvas></div>
      ${((rec.pending || []).slice().reverse()).map(p => `
        <div style="border-top:1px solid var(--border); padding:8px 0; opacity:0.75;">
          <div style="display:flex; justify-content:space-between; align-items:baseline; gap:12px;">
            <span style="font-size:13px;">${fmtDayMonth(p.date)} <span style="text-transform:capitalize; color:var(--text-secondary);">${p.session_type}</span></span>
            <span style="font-size:13px; color:var(--text-muted); white-space:nowrap;">still recovering</span>
          </div>
          <p style="font-size:12px; color:var(--text-muted); margin:3px 0 0;">
            Day ${p.days_since}. HRV ${p.hrv_back != null ? 'back after ' + p.hrv_back + 'd' : 'not back yet'} · RHR ${p.rhr_back != null ? 'back after ' + p.rhr_back + 'd' : 'not back yet'} — no number until both have returned or the ${rec.window_days}-day window closes.
          </p>
        </div>`).join('')}
      ${rec.sessions.slice(-8).reverse().map(s => {
        const d = s.recovery_days;
        const colour = d === null ? 'var(--bad)' : d <= 2 ? 'var(--good)' : d <= 3 ? 'var(--text-secondary)' : 'var(--warn)';
        return `
        <div style="border-top:1px solid var(--border); padding:8px 0;">
          <div style="display:flex; justify-content:space-between; align-items:baseline; gap:12px;">
            <span style="font-size:13px;">${fmtDayMonth(s.date)} <span style="text-transform:capitalize; color:var(--text-secondary);">${s.session_type}</span></span>
            <span style="font-size:14px; font-weight:600; color:${colour}; white-space:nowrap;">${d === null ? 'not within 7d' : d + ' day' + (d === 1 ? '' : 's')}</span>
          </div>
          <p style="font-size:12px; color:var(--text-muted); margin:3px 0 0;">
            HRV ${s.hrv_recovery_days ?? '—'}d · RHR ${s.rhr_recovery_days ?? '—'}d${s.temp_max_c != null ? ` · ${Math.round(s.temp_max_c)}°C` : ''}${s.interrupted_by_next_session ? ' · another hard session landed inside the window' : ''}
          </p>
        </div>`;
      }).join('')}
      <p style="font-size:12px; color:var(--text-muted); margin:10px 0 0; border-top:1px solid var(--border); padding-top:10px;">
        Shaded band is a 0-2 day turnaround. A red bar at the ceiling means recovery never came inside ${rec.window_days} days.
        Measured against the 7-day baseline as it stood <em>before</em> the session, not the rolling one — a rolling baseline drifts down to meet a tiring athlete and would call a suppressed week fully recovered.
      </p>
    </div>
  `;

  const decRuns = ((dec && dec.runs) || []);
  const decClean = decRuns.filter(r => !r.unreliable_reasons.length);
  const decLatest = decClean.length ? decClean[decClean.length - 1] : null;
  const decHtml = !decRuns.length ? '' : `
    <div class="chart-card">
      <p class="title">Aerobic decoupling — does pace still cost the same late in a run?</p>
      ${decLatest ? `
        <p style="font-size:14px; margin:0 0 4px;">
          Last steady run <strong style="color:${decLatest.within_threshold ? 'var(--good)' : 'var(--warn)'};">${decLatest.decoupling_pct > 0 ? '+' : ''}${decLatest.decoupling_pct}%</strong>
          <span style="color:var(--text-muted);">— ${decLatest.first_half.pace}/km at ${Math.round(decLatest.first_half.avg_hr)} bpm, then ${decLatest.second_half.pace}/km at ${Math.round(decLatest.second_half.avg_hr)} bpm</span>
        </p>` : ''}
      <p style="font-size:13px; color:var(--text-secondary); margin:0 0 10px;">
        ${dec.trend && dec.trend.direction ? dec.trend.direction
          : `${(dec.trend && dec.trend.comparable_runs) || 0} clean steady run${((dec.trend && dec.trend.comparable_runs) || 0) === 1 ? '' : 's'} so far — a direction needs four.`}
      </p>
      <div class="chart-wrap" style="height:190px; margin-bottom:6px;"><canvas id="decouplingChart"></canvas></div>
      <p style="font-size:12px; color:var(--text-muted); margin:8px 0 0; border-top:1px solid var(--border); padding-top:10px;">
        Speed per heartbeat in the first half of a run against the second, ignoring the first ${dec.warmup_excluded_min || 10} minutes while heart rate catches up.
        Shaded below ${dec.threshold_pct}% is the aerobic system holding; above it, pace late in the run is costing more beats than pace early on.
        Grey bars are runs not to be read — hills or quality sessions, where the two halves were never comparable.
        This is a months metric: it answers whether an 82-minute half or a three-hour marathon will hold together, and it moves slowly.
      </p>
    </div>
  `;

  // Speed per heartbeat on easy runs — the everyday aerobic marker.
  // Monthly medians, because run to run this is noise.
  const effMonths = (eff && eff.months) || [];
  const effSummary = (eff && eff.summary) || {};
  const effHtml = effMonths.length < 2 ? '' : `
    <div class="chart-card">
      <p class="title">Easy-run efficiency — speed per heartbeat</p>
      <p style="font-size:14px; margin:0 0 4px;">
        ${effSummary.from_month} to ${effSummary.to_month}:
        <strong style="color:${effSummary.change_pct >= 0 ? 'var(--good)' : 'var(--warn)'};">${effSummary.change_pct > 0 ? '+' : ''}${effSummary.change_pct}%</strong>
      </p>
      <p style="font-size:13px; color:var(--text-secondary); margin:0 0 10px;">
        ${effSummary.from_hr_at_pace} &rarr; ${effSummary.to_hr_at_pace}${effSummary.warmer_now ? ' — and it is warmer now, which pushes heart rate up, so the gain is if anything understated.' : ''}
      </p>
      <div class="chart-wrap" style="height:190px; margin-bottom:6px;"><canvas id="efficiencyChart"></canvas></div>
      <p style="font-size:12px; color:var(--text-muted); margin:8px 0 0; border-top:1px solid var(--border); padding-top:10px;">
        Metres per minute divided by average heart rate, easy runs only — quality sessions, hills and runs under 20 minutes excluded. Monthly medians, so one hot plod cannot move a month.
        Rising means a given easy pace is costing fewer beats. Two cautions: heat inflates heart rate, so a summer dip is weather rather than lost fitness; and deep fatigue can suppress heart rate, so a sudden jump inside a heavy block is a question, not a triumph.
      </p>
    </div>
  `;

  // Rep-by-rep execution. The whole-run average hides the thing that
  // matters: "14.01 km at 4:39/km" was 5x1200m within 1.8 sec of each
  // other. Spread is the headline — how evenly the set was judged.
  const repSessions = (detail || []).filter(s => s.reps).slice(-6).reverse();
  // Even reps get "5 x 1200m"; a tempo built from unequal blocks would be
  // misdescribed by the first one's length, so it just says "2 blocks".
  const repLabel = (r) => {
    const d = (r.distance_km_each || []).filter(Boolean);
    if (!d.length) return `${r.count} reps`;
    return r.even_reps ? `${r.count} x ${(d[0] * 1000).toFixed(0)}m` : `${r.count} blocks`;
  };
  const sessionHtml = !repSessions.length ? '' : `
    <div class="chart-card">
      <p class="title">Session execution — how the reps actually went</p>
      ${repSessions.map(s => {
        const r = s.reps;
        const spreadColour = !r.even_reps ? 'var(--text-secondary)'
          : r.spread_sec_per_km <= 3 ? 'var(--good)'
          : r.spread_sec_per_km <= 8 ? 'var(--text-secondary)' : 'var(--warn)';
        const driftLabel = !r.even_reps ? 'blocks at different targets'
          : r.drift_sec_per_km > 1.5 ? `faded ${r.drift_sec_per_km.toFixed(1)}s/km`
          : r.drift_sec_per_km < -1.5 ? `negative split ${Math.abs(r.drift_sec_per_km).toFixed(1)}s/km`
          : 'held throughout';
        return `
        <div style="border-top:1px solid var(--border); padding:10px 0;">
          <div style="display:flex; justify-content:space-between; align-items:baseline; gap:12px;">
            <span style="font-size:13px;">${fmtDayMonth(s.date)}
              <span style="color:var(--text-secondary);">${repLabel(r)}</span>
            </span>
            <span style="font-size:14px; font-weight:600; white-space:nowrap;">${r.mean_pace_fmt}/km</span>
          </div>
          <div style="display:flex; flex-wrap:wrap; gap:4px; margin:8px 0 6px;">
            ${r.pace_fmt.map((p, i) => `
              <span style="font-size:12px; font-variant-numeric:tabular-nums; padding:3px 7px; border-radius:4px;
                background:var(--surface-alt, rgba(127,127,127,0.12));
                ${i === r.fastest_rep - 1 ? 'font-weight:700;' : ''}">${p}</span>
            `).join('')}
          </div>
          <p style="font-size:12px; color:var(--text-muted); margin:0;">
            spread <span style="color:${spreadColour}; font-weight:600;">${r.spread_sec_per_km}s/km</span> · ${driftLabel}${r.mean_hr ? ` · ${Math.round(r.mean_hr)} bpm avg` : ''}${s.volume.total_km ? ` · ${s.volume.total_km} km all in` : ''}${s.structured ? '' : ' · reps inferred from pace'}
          </p>
        </div>`;
      }).join('')}
      <p style="font-size:12px; color:var(--text-muted); margin:10px 0 0; border-top:1px solid var(--border); padding-top:10px;">
        Spread is fastest to slowest rep — under 3 sec/km is a well-judged set. Recovery distances are recorded but not read as fatigue: the recovery is a fixed time, so the distance covered depends on the route and how the jog was run that day.
      </p>
    </div>
  `;

  panel.innerHTML = `
    <div class="card-grid">
      <div class="card">
        <p class="label">VO2max</p>
        <p class="value">${latestVo2 ? latestVo2.vo2max : '--'}</p>
        <p class="delta flat">${latestVo2 ? 'as of ' + fmtDate(latestVo2.vo2max_date) : 'no data yet'}</p>
      </div>
      <div class="card">
        <p class="label">Training status</p>
        <p class="value" style="font-size:16px; text-transform:capitalize;">${(today.training_status_feedback || 'n/a').toLowerCase().replace(/_/g, ' ')}</p>
      </div>
    </div>
    <div class="chart-card">
      <p class="title">VO2max trend</p>
      <div class="chart-wrap"><canvas id="vo2Chart"></canvas></div>
    </div>
    ${decHtml}
    ${effHtml}
    ${sessionHtml}
    ${recoveryHtml}
  `;

  drawRecoveryChart(rec);
  drawDecouplingChart(dec);
  drawEfficiencyChart(eff);

  if (vo2Rows.length < 2) {
    document.querySelector('#tab-performance .chart-wrap').innerHTML =
      '<p style="color:var(--text-muted); font-size:13px; padding-top:2rem; text-align:center;">Not enough VO2max readings yet to plot a trend — Garmin updates this every few days, not daily.</p>';
    return;
  }

  new Chart(document.getElementById('vo2Chart'), {
    type: 'line',
    data: {
      labels: vo2Rows.map(r => fmtDayMonth(r.date)),
      datasets: [{
        label: 'VO2max',
        data: vo2Rows.map(r => r.vo2max),
        borderColor: THEME.blue,
        backgroundColor: THEME.blue,
        borderWidth: 2,
        tension: 0.3,
        pointRadius: 4,
      }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: axisXY({
        y: { ticks: { color: THEME.tick } },
        x: { ticks: { color: THEME.tick, maxTicksLimit: 8 } },
      }),
      plugins: { legend: { display: false } },
    },
  });
}

async function buildRacesTab() {
  const panel = document.getElementById('tab-races');
  let races = [];
  try {
    const res = await fetch('races.json?v=' + Date.now());
    if (res.ok) races = await res.json();
  } catch (e) {
    panel.innerHTML = '<p class="error">Could not load races.json</p>';
    return;
  }

  races.sort((a, b) => b.date.localeCompare(a.date));

  panel.innerHTML = `
    <div class="chart-card">
      <p class="title">Race history</p>
      <table style="width:100%; border-collapse:collapse; font-size:13px;">
        <thead>
          <tr style="text-align:left; color:var(--text-muted);">
            <th style="padding:6px 8px;">Date</th>
            <th style="padding:6px 8px;">Race</th>
            <th style="padding:6px 8px;">Distance</th>
            <th style="padding:6px 8px;">Time</th>
            <th style="padding:6px 8px;">Tapered</th>
            <th style="padding:6px 8px;">Notes</th>
          </tr>
        </thead>
        <tbody>
          ${races.map(r => `
            <tr style="border-top:1px solid var(--border);">
              <td style="padding:6px 8px;">${fmtDate(r.date)}</td>
              <td style="padding:6px 8px;">${r.name}</td>
              <td style="padding:6px 8px;">${r.distance_km ?? '--'} km</td>
              <td style="padding:6px 8px;">${r.time_fmt ?? '--'}</td>
              <td style="padding:6px 8px;">${r.tapered ? 'Yes' : 'No'}</td>
              <td style="padding:6px 8px; color:var(--text-secondary);">${r.notes ?? ''}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}

async function loadTrainingPlan() {
  try {
    const res = await fetch('training_plan.json?v=' + Date.now());
    if (!res.ok) return;
    const plan = await res.json();
    const today = new Date().toISOString().slice(0, 10);
    const upcoming = plan.filter(s => s.date >= today).sort((a, b) => a.date.localeCompare(b.date));
    if (upcoming.length === 0) return;

    document.getElementById('planCard').style.display = 'block';
    document.getElementById('planRows').innerHTML = upcoming.map(s => `
      <tr style="border-top:1px solid var(--border);">
        <td style="padding:6px 8px;">${fmtDate(s.date)}</td>
        <td style="padding:6px 8px; text-transform:capitalize;">${s.session_type}</td>
        <td style="padding:6px 8px;">${s.target_distance_km ?? '--'} km</td>
        <td style="padding:6px 8px;">${s.target_pace ?? '--'}</td>
      </tr>
    `).join('');
  } catch (e) {
    // no plan file yet, leave hidden
  }
}
</script>
