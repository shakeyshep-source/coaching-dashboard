        `).join('')}
      ` : ''}
    </div>
  `;
}

// Recovery days per quality session, with a rolling average over the
// last three. The individual bars are noisy — heat, a late night, a hard
// week all move them — so the dashed line is the thing to actually read.
// Sessions that never came back inside the 7-day window are drawn at the
// ceiling in the alert colour rather than dropped, since silently hiding
// the worst results would defeat the point.

// Aerobic decoupling: how much pace costs late in a run versus early.
// Under 5% is Friel's "the aerobic system held". Unreliable runs (hills,
// quality sessions) are drawn hollow rather than hidden — excluding them
// silently would flatter the line.
function drawEfficiencyChart(eff) {
  const el = document.getElementById('efficiencyChart');
  const months = (eff && eff.months) || [];
  if (!el || months.length < 2) return;
  new Chart(el, {
    type: 'line',
    data: {
      labels: months.map(m => m.month),
      datasets: [{
        label: 'm/min per bpm',
        data: months.map(m => m.efficiency),
        borderColor: THEME.blue,
        backgroundColor: THEME.blue,
        borderWidth: 2,
        tension: 0.3,
        pointRadius: 4,
      }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: axisXY({
        y: { ticks: { color: THEME.tick } },
        x: { ticks: { color: THEME.tick, maxTicksLimit: 12 } },
      }),
      plugins: { legend: { display: false } },
    },
  });
}

function drawDecouplingChart(dec) {
  const el = document.getElementById('decouplingChart');
  if (!el || !dec || !dec.runs || !dec.runs.length) return;
  const runs = dec.runs.slice(-14);
  const clean = runs.map(r => !r.unreliable_reasons.length);
  const values = runs.map(r => r.decoupling_pct);
  const threshold = dec.threshold_pct || 5;

  new Chart(el, {
    plugins: [bandPlugin],
    data: {
      labels: runs.map(r => fmtDayMonth(r.date)),
      datasets: [{
        type: 'bar',
        label: 'Decoupling %',
        data: values,
        backgroundColor: runs.map((r, i) => !clean[i] ? 'rgba(127,127,127,0.28)'
          : r.decoupling_pct <= threshold ? THEME.blue : THEME.warn),
        borderRadius: 4,
      }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: axisXY({
        y: { ticks: { color: THEME.tick }, title: { display: false } },
        x: { ticks: { color: THEME.tick, maxTicksLimit: 8 } },
      }),
      plugins: {
        legend: { display: false },
        band: { min: -100, max: threshold, color: 'rgba(46, 125, 50, 0.10)' },
      },
    },
  });
}

function drawRecoveryChart(rec) {
  const el = document.getElementById('recoveryChart');
  if (!el || !rec || !rec.sessions.length) return;
  const sessions = rec.sessions.slice(-12);
  const cap = rec.window_days || 7;
  const values = sessions.map(s => s.recovery_days === null ? cap : s.recovery_days);
  const capped = sessions.map(s => s.recovery_days === null);
  // A drink or a short night inside the window explains a long recovery
  // without training having caused it. Drawing those in the same red as
  // a genuine non-recovery makes an explained week look like the worst
  // in the block — 1 Aug, where the beers were on the Saturday night.
  const confounded = sessions.map(s => (s.confounders_in_window || []).length > 0);

  // Rolling mean of the last three, so a single bad session doesn't read
  // as a trend. Capped sessions count as the ceiling — a floor on how bad
  // they were, which is better than excluding them and flattering the line.
  const rolling = values.map((_, i) => {
    if (i < 2) return null;
    const w = values.slice(i - 2, i + 1);
    return Math.round((w.reduce((a, b) => a + b, 0) / w.length) * 10) / 10;
  });

  new Chart(el, {
    plugins: [bandPlugin],
    data: {
      labels: sessions.map(s => fmtDayMonth(s.date)),
      datasets: [
        {
          type: 'bar',
          label: 'Days to recover',
          data: values,
          backgroundColor: sessions.map((s, i) => confounded[i] ? 'rgba(127,127,127,0.35)'
            : capped[i] ? THEME.bad : THEME.blue),
          borderRadius: 4,
        },
        {
          type: 'line',
          label: 'Rolling average (3 sessions)',
          data: rolling,
          borderColor: THEME.yellow,
          borderDash: [6, 4],
          borderWidth: 2,
          pointRadius: 0,
          spanGaps: true,
        },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: axisXY({
        y: { min: 0, max: cap, ticks: { color: THEME.tick, stepSize: 1 } },
        x: { ticks: { color: THEME.tick, maxTicksLimit: 8 } },
      }),
      plugins: {
        legend: { labels: { color: THEME.ink, boxWidth: 12, font: { size: 11 } } },
        // Shading the quick-turnaround zone means "is this good?" is
        // answered by where the bar sits, not by remembering a threshold.
        band: { min: 0, max: 2, color: 'rgba(46, 125, 50, 0.10)' },
      },
    },
  });
}

async function buildPerformanceTab(data) {
  const panel = document.getElementById('tab-performance');
  const [rec, detail, dec, eff] = await Promise.all([
    fetchJson('recovery_log.json'),
    fetchJson('session_detail.json'),
    fetchJson('decoupling.json'),
    fetchJson('efficiency_history.json'),
  ]);
  const today = data[data.length - 1];
  // Prefer the long series (vo2max_history.json, weekly back to January)
  // over the 14-day computed window — VO2max moves over months, and a
  // fortnight of it says nothing.
  const vo2Long = await fetchJson('vo2max_history.json');
  const vo2Rows = (vo2Long && vo2Long.length >= 2)
    ? vo2Long
    : data.filter(r => r.vo2max);
  const latestVo2 = vo2Rows.length ? vo2Rows[vo2Rows.length - 1] : null;

  // Days for HRV and RHR to return to where they sat BEFORE a quality
  // session. The number itself matters less than which way it moves over
  // months — lengthening recovery shows up before soreness does.
  const measured = ((rec && rec.sessions) || []).filter(s => s.recovery_days !== null);
  const trendColour = !rec || !rec.trend ? 'var(--text-muted)'
    : rec.trend.direction.startsWith('lengthening') ? 'var(--warn)'
    : rec.trend.direction.startsWith('shortening') ? 'var(--good)' : 'var(--text-secondary)';
  const recoveryHtml = !rec || !rec.sessions.length ? '' : `
    <div class="chart-card">
      <p class="title">Recovery after quality sessions — days back to pre-session normal</p>
      ${rec.trend ? `
        <p style="font-size:14px; margin:0 0 4px;">
          Recent average <strong>${rec.trend.recent_avg_days} days</strong>${rec.trend.prior_avg_days != null ? `, previously ${rec.trend.prior_avg_days}` : ''}
        </p>
        <p style="font-size:13px; color:${trendColour}; margin:0 0 10px;">${rec.trend.direction}</p>
      ` : `
        <p style="font-size:13px; color:var(--text-muted); margin:0 0 10px;">
          ${measured.length} session${measured.length === 1 ? '' : 's'} measured so far — a trend needs four.
          This one is built to be read over months, not weeks.
        </p>
      `}
      <div class="chart-wrap" style="height:190px; margin-bottom:6px;"><canvas id="recoveryChart"></canvas></div>
      ${((rec.pending || []).slice().reverse()).map(p => `
        <div style="border-top:1px solid var(--border); padding:8px 0; opacity:0.75;">
          <div style="display:flex; justify-content:space-between; align-items:baseline; gap:12px;">
            <span style="font-size:13px;">${fmtDayMonth(p.date)} <span style="text-transform:capitalize; color:var(--text-secondary);">${p.session_type}</span></span>
            <span style="font-size:13px; color:var(--text-muted); white-space:nowrap;">still recovering</span>
          </div>
          <p style="font-size:12px; color:var(--text-muted); margin:3px 0 0;">
            Day ${p.days_since}. HRV ${p.hrv_back != null ? 'back after ' + p.hrv_back + 'd' : 'not back yet'} · RHR ${p.rhr_back != null ? 'back after ' + p.rhr_back + 'd' : 'not back yet'} — no number until both have returned or the ${rec.window_days}-day window closes.
          </p>
        </div>`).join('')}
      ${rec.sessions.slice(-8).reverse().map(s => {
        const d = s.recovery_days;
        const colour = d === null ? 'var(--bad)' : d <= 2 ? 'var(--good)' : d <= 3 ? 'var(--text-secondary)' : 'var(--warn)';
        return `
        <div style="border-top:1px solid var(--border); padding:8px 0;">
          <div style="display:flex; justify-content:space-between; align-items:baseline; gap:12px;">
            <span style="font-size:13px;">${fmtDayMonth(s.date)} <span style="text-transform:capitalize; color:var(--text-secondary);">${s.session_type}</span></span>
            <span style="font-size:14px; font-weight:600; color:${colour}; white-space:nowrap;">${d === null ? 'not within 7d' : d + ' day' + (d === 1 ? '' : 's')}</span>
          </div>
          <p style="font-size:12px; color:var(--text-muted); margin:3px 0 0;">
            HRV ${s.hrv_recovery_days ?? '—'}d · RHR ${s.rhr_recovery_days ?? '—'}d${s.temp_max_c != null ? ` · ${Math.round(s.temp_max_c)}°C` : ''}${(s.confounders_in_window || []).length ? ` · ${s.confounders_in_window.join(', ')} in the window — not training load` : ''}${s.interrupted_by_next_session ? ' · another hard session landed inside the window' : ''}
          </p>
        </div>`;
      }).join('')}
      <p style="font-size:12px; color:var(--text-muted); margin:10px 0 0; border-top:1px solid var(--border); padding-top:10px;">
        Shaded band is a 0-2 day turnaround. A red bar at the ceiling means recovery never came inside ${rec.window_days} days. Grey bars had a drink, a short night or similar inside the window — those are explained rather than earned, and are left out of the trend.
        Measured against the 7-day baseline as it stood <em>before</em> the session, not the rolling one — a rolling baseline drifts down to meet a tiring athlete and would call a suppressed week fully recovered.
      </p>
    </div>
  `;

  const decRuns = ((dec && dec.runs) || []);
  const decClean = decRuns.filter(r => !r.unreliable_reasons.length);
  const decLatest = decClean.length ? decClean[decClean.length - 1] : null;
  const decHtml = !decRuns.length ? '' : `
    <div class="chart-card">
      <p class="title">Aerobic decoupling — does pace still cost the same late in a run?</p>
      <p class="plain"><b>What it means.</b> It compares the second half of a steady run with the
        first: how much more heart rate the same speed cost you. <b>Under ${dec.threshold_pct}% means
        the aerobic system held</b> — the last hour costs no more beats than the first. That is
        durability, and it is the question a marathon asks loudest. A negative number almost
        always means you sped up, not a miracle. It moves over months, so never read one run.</p>
      ${decLatest ? `
        <p style="font-size:14px; margin:0 0 4px;">
          Last steady run <strong style="color:${decLatest.within_threshold ? 'var(--good)' : 'var(--warn)'};">${decLatest.decoupling_pct > 0 ? '+' : ''}${decLatest.decoupling_pct}%</strong>
          <span style="color:var(--text-muted);">— ${decLatest.first_half.pace}/km at ${Math.round(decLatest.first_half.avg_hr)} bpm, then ${decLatest.second_half.pace}/km at ${Math.round(decLatest.second_half.avg_hr)} bpm</span>
        </p>` : ''}
      <p style="font-size:13px; color:var(--text-secondary); margin:0 0 10px;">
        ${dec.trend && dec.trend.direction ? dec.trend.direction
          : `${(dec.trend && dec.trend.comparable_runs) || 0} clean steady run${((dec.trend && dec.trend.comparable_runs) || 0) === 1 ? '' : 's'} so far — a direction needs four.`}
      </p>
      <div class="chart-wrap" style="height:190px; margin-bottom:6px;"><canvas id="decouplingChart"></canvas></div>
      <p style="font-size:12px; color:var(--text-muted); margin:8px 0 0; border-top:1px solid var(--border); padding-top:10px;">
        Speed per heartbeat in the first half of a run against the second, ignoring the first ${dec.warmup_excluded_min || 10} minutes while heart rate catches up.
        Shaded below ${dec.threshold_pct}% is the aerobic system holding; above it, pace late in the run is costing more beats than pace early on.
        Grey bars are runs not to be read — hills or quality sessions, where the two halves were never comparable.
        This is a months metric: it answers whether an 82-minute half or a three-hour marathon will hold together, and it moves slowly.
      </p>
    </div>
  `;

  // Speed per heartbeat on easy runs — the everyday aerobic marker.
  // Monthly medians, because run to run this is noise.
  const effMonths = (eff && eff.months) || [];
  const effSummary = (eff && eff.summary) || {};
  const effHtml = effMonths.length < 2 ? '' : `
    <div class="chart-card">
      <p class="title">Easy-run efficiency — speed per heartbeat</p>
      <p style="font-size:14px; margin:0 0 4px;">
        ${effSummary.from_month} to ${effSummary.to_month}:
        <strong style="color:${effSummary.change_pct >= 0 ? 'var(--good)' : 'var(--warn)'};">${effSummary.change_pct > 0 ? '+' : ''}${effSummary.change_pct}%</strong>
      </p>
      <p style="font-size:13px; color:var(--text-secondary); margin:0 0 10px;">
        ${effSummary.from_hr_at_pace} &rarr; ${effSummary.to_hr_at_pace}${effSummary.warmer_now ? ' — and it is warmer now, which pushes heart rate up, so the gain is if anything understated.' : ''}
      </p>
      <div class="chart-wrap" style="height:190px; margin-bottom:6px;"><canvas id="efficiencyChart"></canvas></div>
      <p style="font-size:12px; color:var(--text-muted); margin:8px 0 0; border-top:1px solid var(--border); padding-top:10px;">
        Metres per minute divided by average heart rate, easy runs only — quality sessions, hills and runs under 20 minutes excluded. Monthly medians, so one hot plod cannot move a month.
        Rising means a given easy pace is costing fewer beats. Two cautions: heat inflates heart rate, so a summer dip is weather rather than lost fitness; and deep fatigue can suppress heart rate, so a sudden jump inside a heavy block is a question, not a triumph.
      </p>
    </div>
  `;

  // Rep-by-rep execution. The whole-run average hides the thing that
  // matters: "14.01 km at 4:39/km" was 5x1200m within 1.8 sec of each
  // other. Spread is the headline — how evenly the set was judged.
  const repSessions = (detail || []).filter(s => s.reps).slice(-6).reverse();
  // Even reps get "5 x 1200m"; a tempo built from unequal blocks would be
  // misdescribed by the first one's length, so it just says "2 blocks".
  const repLabel = (r) => {
    const d = (r.distance_km_each || []).filter(Boolean);
    if (!d.length) return `${r.count} reps`;
    return r.even_reps ? `${r.count} x ${(d[0] * 1000).toFixed(0)}m` : `${r.count} blocks`;
  };
  const sessionHtml = !repSessions.length ? '' : `
    <div class="chart-card">
      <p class="title">Session execution — how the reps actually went</p>
      ${repSessions.map(s => {
        const r = s.reps;
        const spreadColour = !r.even_reps ? 'var(--text-secondary)'
          : r.spread_sec_per_km <= 3 ? 'var(--good)'
          : r.spread_sec_per_km <= 8 ? 'var(--text-secondary)' : 'var(--warn)';
        const driftLabel = !r.even_reps ? 'blocks at different targets'
          : r.drift_sec_per_km > 1.5 ? `faded ${r.drift_sec_per_km.toFixed(1)}s/km`
          : r.drift_sec_per_km < -1.5 ? `negative split ${Math.abs(r.drift_sec_per_km).toFixed(1)}s/km`
          : 'held throughout';
        return `
        <div style="border-top:1px solid var(--border); padding:10px 0;">
          <div style="display:flex; justify-content:space-between; align-items:baseline; gap:12px;">
            <span style="font-size:13px;">${fmtDayMonth(s.date)}
              <span style="color:var(--text-secondary);">${repLabel(r)}</span>
            </span>
            <span style="font-size:14px; font-weight:600; white-space:nowrap;">${r.mean_pace_fmt}/km</span>
          </div>
          <div style="display:flex; flex-wrap:wrap; gap:4px; margin:8px 0 6px;">
            ${r.pace_fmt.map((p, i) => `
              <span style="font-size:12px; font-variant-numeric:tabular-nums; padding:3px 7px; border-radius:4px;
                background:var(--surface-alt, rgba(127,127,127,0.12));
                ${i === r.fastest_rep - 1 ? 'font-weight:700;' : ''}">${p}</span>
            `).join('')}
          </div>
          <p style="font-size:12px; color:var(--text-muted); margin:0;">
            spread <span style="color:${spreadColour}; font-weight:600;">${r.spread_sec_per_km}s/km</span> · ${driftLabel}${r.mean_hr ? ` · ${Math.round(r.mean_hr)} bpm avg` : ''}${s.volume.total_km ? ` · ${s.volume.total_km} km all in` : ''}${s.structured ? '' : ' · reps inferred from pace'}
          </p>
        </div>`;
      }).join('')}
      <p style="font-size:12px; color:var(--text-muted); margin:10px 0 0; border-top:1px solid var(--border); padding-top:10px;">
        Spread is fastest to slowest rep — under 3 sec/km is a well-judged set. Recovery distances are recorded but not read as fatigue: the recovery is a fixed time, so the distance covered depends on the route and how the jog was run that day.
      </p>
    </div>
  `;

  panel.innerHTML = `
    <div class="card-grid">
      <div class="card">
        <p class="label">VO2max</p>
        <p class="value">${latestVo2 ? latestVo2.vo2max : '--'}</p>
        <p class="delta flat">${latestVo2 ? 'as of ' + fmtDate(latestVo2.vo2max_date || latestVo2.date) : 'no data yet'}</p>
      </div>
      <div class="card">
        <p class="label">Training status</p>
        <p class="value" style="font-size:16px; text-transform:capitalize;">${(today.training_status_feedback || 'n/a').toLowerCase().replace(/_/g, ' ')}</p>
      </div>
    </div>
    <div class="chart-card">
      <p class="title">VO2max trend</p>
      <div class="chart-wrap"><canvas id="vo2Chart"></canvas></div>
    </div>
    ${decHtml}
    ${effHtml}
    ${sessionHtml}
    ${recoveryHtml}
  `;

  drawRecoveryChart(rec);
  drawDecouplingChart(dec);
  drawEfficiencyChart(eff);

  if (vo2Rows.length < 2) {
    document.querySelector('#tab-performance .chart-wrap').innerHTML =
      '<p style="color:var(--text-muted); font-size:13px; padding-top:2rem; text-align:center;">Not enough VO2max readings yet to plot a trend — Garmin updates this every few days, not daily.</p>';
    return;
  }

  new Chart(document.getElementById('vo2Chart'), {
    type: 'line',
    data: {
      labels: vo2Rows.map(r => fmtDayMonth(r.date)),
      datasets: [{
        label: 'VO2max',
        data: vo2Rows.map(r => r.vo2max),
        borderColor: THEME.blue,
        backgroundColor: THEME.blue,
        borderWidth: 2,
        tension: 0.3,
        pointRadius: 4,
      }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: axisXY({
        y: { ticks: { color: THEME.tick } },
        x: { ticks: { color: THEME.tick, maxTicksLimit: 8 } },
      }),
      plugins: { legend: { display: false } },
    },
  });
}

async function buildRacesTab() {
  const panel = document.getElementById('tab-races');
  let races = [];
  try {
    const res = await fetch('races.json?v=' + Date.now());
    if (res.ok) races = await res.json();
  } catch (e) {
    panel.innerHTML = '<p class="error">Could not load races.json</p>';
    return;
  }

  races.sort((a, b) => b.date.localeCompare(a.date));

  // races.json is results — what happened, with a time. Fixtures are
  // what is still ahead, and they carry no time and often no confirmed
  // date, so they are a separate file rather than rows with holes in
  // them that race_predictor.py would have to learn to skip.
  const fixtures = (await fetchJson('fixtures.json')) || [];
  const todayStr = toDateStr(new Date());
  const upcoming = fixtures
    .filter(f => f.date == null || f.date >= todayStr)
    .sort((a, b) => (a.date || '9999').localeCompare(b.date || '9999'));

  const intentChip = f => {
    const label = { target: 'Target', race: 'Racing it', 'not raced': 'Not raced',
                    undecided: 'Undecided' }[f.intent] || f.intent || '';
    const cls = f.intent === 'target' ? 'bad' : f.intent === 'undecided' ? 'warn' : '';
    return label ? `<span class="chip ${cls}">${esc(label)}</span>` : '';
  };

  // Stacked rows, not a five-column table. The coaching notes on a
  // fixture are a paragraph each — they were being squeezed into a
  // column roughly 90px wide on a phone.
  const fixturesHtml = upcoming.length ? `
    <div class="sect" style="margin-top:0;">
      <div class="sect-h"><b>Coming up</b><span>${upcoming.length}</span></div>
      ${upcoming.map(f => {
        const days = f.date
          ? Math.round((new Date(f.date + 'T00:00:00') - new Date(todayStr + 'T00:00:00')) / 86400000)
          : null;
        const isTarget = f.intent === 'target';
        return `
        <div style="border-bottom:1px solid var(--border); padding:10px 0 10px ${isTarget ? '10px' : '0'};
                    ${isTarget ? 'box-shadow:inset 3px 0 0 var(--club-blue);' : ''}">
          <div style="display:flex; align-items:baseline; justify-content:space-between; gap:10px;">
            <span style="font-size:14.5px; font-weight:600;">${esc(f.name)}</span>
            <span style="font-family:var(--mono); font-size:14px; font-weight:600; white-space:nowrap;">${
              days == null ? '--' : days === 0 ? 'today' : days === 1 ? 'tomorrow' : days + 'd'}</span>
          </div>
          <div style="font-family:var(--mono); font-size:11px; color:var(--text-muted); margin-top:3px;">
            ${f.date
              ? new Date(f.date + 'T00:00:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' })
              : esc(f.date_note || 'date TBC')}${f.distance_km != null ? ' · ' + f.distance_km + ' km' : ''}
          </div>
          <div>${f.status === 'possible' ? '<span class="chip">Possible</span>' : ''}${intentChip(f)}</div>
          ${f.notes ? `<p style="margin:7px 0 0; font-size:12.5px; color:var(--text-secondary); line-height:1.45;">${esc(f.notes)}</p>` : ''}
        </div>`;
      }).join('')}
    </div>` : '';

  // Results as a board rather than a card: every race this year in one
  // place, newest first, with the ones the predictor ignores greyed
  // instead of silently identical to the ones it uses.
  const excluded = races.filter(r => r.include_in_prediction === false).length;
  panel.innerHTML = fixturesHtml + `
    <div class="sect">
      <div class="sect-h"><b>Results</b><span>${races.length} race${races.length === 1 ? '' : 's'}</span></div>
      <div class="tblwrap">
        <table class="tbl">
          <thead>
            <tr><th>Date</th><th class="l">Race</th><th>Dist</th><th>Time</th></tr>
          </thead>
          <tbody>
            ${races.map(r => `
              <tr class="${r.include_in_prediction === false ? 'ex' : ''}">
                <td style="white-space:nowrap;">${fmtDayMonth(r.date)}</td>
                <td class="l">${esc(r.name)}${r.tapered ? '<span class="chip" style="margin:0 0 0 6px; font-size:9px; padding:1px 5px;">tapered</span>' : ''}</td>
                <td>${r.distance_km != null ? r.distance_km.toFixed(1) : '--'}</td>
                <td><strong>${esc(r.time_fmt ?? '--')}</strong></td>
              </tr>
              ${r.notes ? `<tr class="${r.include_in_prediction === false ? 'ex' : ''}"><td colspan="4" class="l" style="padding:0 0 8px; font-size:11px; color:var(--text-muted); border-bottom:1px solid var(--border);">${esc(r.notes)}</td></tr>` : ''}
            `).join('')}
          </tbody>
        </table>
      </div>
      ${excluded ? `<p class="plain" style="margin-top:12px;">Greyed rows are <b>excluded from
        the projections</b> — a leg of a relay, a race run in conditions that were not normal, or
        one that predates the current block. The rest are what the predicted times are built
        from.</p>` : ''}
    </div>
  `;
}

// The old "Upcoming sessions" card on the overview. The week lane and
// the three-week plan tables on Today replaced it, so the card is gone
// — this keeps working if it is ever put back, and does nothing if not.
async function loadTrainingPlan() {
  const card = document.getElementById('planCard');
  const rows = document.getElementById('planRows');
  if (!card || !rows) return;
  try {
    const res = await fetch('training_plan.json?v=' + Date.now());
    if (!res.ok) return;
    const plan = await res.json();
    // Local components, never toISOString — on BST that converts to UTC
    // and reports yesterday for the first hour of every day.
    const today = toDateStr(new Date());
    const upcoming = plan.filter(s => s.date >= today).sort((a, b) => a.date.localeCompare(b.date));
    if (upcoming.length === 0) return;

    card.style.display = 'block';
    rows.innerHTML = upcoming.map(s => `
      <tr style="border-top:1px solid var(--border);">
        <td style="padding:6px 8px;">${fmtDate(s.date)}</td>
        <td style="padding:6px 8px; text-transform:capitalize;">${s.session_type}</td>
        <td style="padding:6px 8px;">${s.target_distance_km ?? '--'} km</td>
        <td style="padding:6px 8px;">${s.target_pace ?? '--'}</td>
      </tr>
    `).join('');
  } catch (e) {
    // no plan file yet, leave hidden
  }
}
