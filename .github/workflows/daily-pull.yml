# Daily data pipeline — replaces the laptop cron entirely.
#
# Runs twice each morning (UTC): an early pull so the dashboard is fresh
# before 8am UK, and a late-morning catch-up that picks up a late watch
# sync or a form submitted after the first run. Safe to run repeatedly —
# every step is idempotent and only changed files get committed.
#
# Required repo secret:
#   GARMIN_TOKENS_B64 — base64 of the laptop's ~/.garmin_tokens directory.
#   Generate with export_garmin_tokens.sh (see AUTOMATION_SETUP.md).
#   Garmin's long-lived token lasts ~a year; regenerate when the pull
#   starts failing with auth errors.

name: Daily data pull

# GitHub fires scheduled runs late under load — observed ~2.5h behind
# the cron time on this repo (30 Jul: the 05:15 slot ran 07:42, the
# 10:30 slot ran 12:09). Slots are therefore set far enough ahead of
# the "fresh by 8am UK" requirement that even a badly delayed run
# still makes it.
on:
  schedule:
    - cron: '30 3 * * *'   # 04:30 UK summer; ~7am UK even with a 2.5h delay
    - cron: '20 6 * * *'   # ~07:20 UK backstop if the first run lagged or watch hadn't synced
    - cron: '30 10 * * *'  # late-morning catch-up for form entries
  workflow_dispatch: {}     # manual "run now" button in the Actions tab

permissions:
  contents: write
  id-token: write   # claude-code-action wants it available even when github_token is supplied

concurrency:
  group: daily-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore Garmin tokens
        env:
          GARMIN_TOKENS_B64: ${{ secrets.GARMIN_TOKENS_B64 }}
        run: |
          if [ -z "$GARMIN_TOKENS_B64" ]; then
            echo "::warning::GARMIN_TOKENS_B64 secret not set - Garmin pull will fail, rest of pipeline still runs"
          else
            echo "$GARMIN_TOKENS_B64" | base64 -d | tar -xz -C "$HOME"
            echo "Tokens restored to $HOME/.garmin_tokens"
          fi

      - name: Run pipeline
        # run_all.py exits non-zero if any step failed but still builds
        # the computed layer from whatever data it has — so we always
        # continue to the commit step and surface failures as a warning.
        env:
          GARMIN_TOKENSTORE: /home/runner/.garmin_tokens
        run: |
          python run_all.py || echo "::warning::One or more pipeline steps failed - check the log above"

      # A query against a "hold" review has no proposal to approve, so
      # it used to wait for the next Sunday session - up to a week for
      # an answer. apply_review.py marks a freshly logged response
      # athlete_response_status="logged"; if one is sitting there, reply
      # to it now. The reply step flips it to "answered", so this fires
      # once and not on every subsequent pull.
      - name: Is a review query waiting for a reply?
        id: query
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          try:
              latest = json.load(open("weekly_review_latest.json"))
          except Exception:
              latest = {}
          waiting = bool(latest.get("athlete_response")) and \
              latest.get("athlete_response_status") == "logged"
          print(f"reply={'true' if waiting else 'false'}")
          PY
          cat "$GITHUB_OUTPUT"

      - name: Normalise the Claude credential
        if: steps.query.outputs.reply == 'true'
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          APIKEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          OAUTH_CLEAN="$(printf '%s' "$OAUTH" | tr -d '[:space:]')"
          APIKEY_CLEAN="$(printf '%s' "$APIKEY" | tr -d '[:space:]')"
          if [ -n "$OAUTH_CLEAN" ]; then echo "::add-mask::$OAUTH_CLEAN"; fi
          if [ -n "$APIKEY_CLEAN" ]; then echo "::add-mask::$APIKEY_CLEAN"; fi
          if [ -z "$OAUTH_CLEAN" ] && [ -z "$APIKEY_CLEAN" ]; then
            echo "::warning::No Claude credential set - the review query stays logged for Sunday's session."
          fi
          {
            echo "OAUTH_CLEAN=$OAUTH_CLEAN"
            echo "APIKEY_CLEAN=$APIKEY_CLEAN"
          } >> "$GITHUB_ENV"

      - name: Reply to the review query
        if: steps.query.outputs.reply == 'true' && (env.OAUTH_CLEAN != '' || env.APIKEY_CLEAN != '')
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ env.OAUTH_CLEAN }}
          anthropic_api_key: ${{ env.APIKEY_CLEAN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Shep has queried the latest weekly review. Follow the
            "Answering a review query" section of CLAUDE.md exactly.
            Read the brief, weekly_review_latest.json (his words are in
            athlete_response), the review it refers to in reviews/, plus
            weekly_summary.json, computed_data.json, manual_log.json
            (every session note), training_plan.json and
            race_prediction.json.

            Answer him directly and honestly: what he said, whether the
            evidence supports it, and what you are doing about it. If it
            changes nothing, say so and say why - agreeing to keep him
            happy is a failure, not a courtesy. If it does change the
            read, write plan_proposal.json (status "pending", id =
            today's date) so it still goes through his approval.

            Write the reply into weekly_review_latest.json as
            "coach_reply" (markdown, a few short paragraphs) with
            "coach_reply_at" (ISO timestamp) and set
            "athlete_response_status" to "answered".

            Do NOT edit training_plan.json. Do NOT commit or push - the
            workflow commits afterwards.
          claude_args: |
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(python3:*)"
            --max-turns 30

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.json'
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Auto update $(date -u +%F) (cloud pipeline)"
            git pull --rebase origin main
            git push origin main
          fi
