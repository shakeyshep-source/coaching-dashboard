# Coach reply — responds to a form submission within about a minute.
#
# Two things can be waiting, and coach_reply_gate.py decides which:
#
#   QUERY  a review that proposed nothing has no gate to reach, so the
#          response lands on weekly_review_latest.json as
#          athlete_response with status "logged". Answer it, flip the
#          flag to "answered".
#   AMEND  a review that DID propose gets the response attached to
#          plan_proposal.json, and "amend" sets it to amend_requested.
#          Revise the proposal, set it back to "pending".
#
# Only QUERY used to fire. On 20 Sep 2026 Shep amended a proposal at
# 18:13 saying he could not run the coming Sunday, and nothing happened
# - the revision would have waited six days to change a week starting
# the next morning. Either flag now runs this, and both self-clear, so
# it runs once per submission rather than on every pipeline run.
#
# Called by both pipelines (review-response.yml on form submit,
# daily-pull.yml on the morning schedule) rather than duplicated in
# each, so there is one definition of what a reply does.

name: Coach reply

on:
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write   # claude-code-action wants it available even when github_token is supplied

jobs:
  reply:
    runs-on: ubuntu-latest
    steps:
      # main, not the calling run's SHA — the caller has usually just
      # pushed the logged response we are about to answer.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Is a coach session waiting?
        id: query
        run: |
          python3 coach_reply_gate.py >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Normalise the Claude credential
        if: steps.query.outputs.reply == 'true'
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          APIKEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          OAUTH_CLEAN="$(printf '%s' "$OAUTH" | tr -d '[:space:]')"
          APIKEY_CLEAN="$(printf '%s' "$APIKEY" | tr -d '[:space:]')"
          if [ -n "$OAUTH_CLEAN" ]; then echo "::add-mask::$OAUTH_CLEAN"; fi
          if [ -n "$APIKEY_CLEAN" ]; then echo "::add-mask::$APIKEY_CLEAN"; fi
          if [ -z "$OAUTH_CLEAN" ] && [ -z "$APIKEY_CLEAN" ]; then
            echo "::warning::No Claude credential set - the question or amend waits for Sunday's session."
          fi
          # An API key wins when both are present. The subscription token
          # is the cheaper path and stays the default, but it dies the
          # moment the subscription is paused - on 11 Sep that failed
          # every reply for two days with "Your organization has disabled
          # Claude subscription access for Claude Code". Setting
          # ANTHROPIC_API_KEY is then the whole fix: no secret to delete
          # first, and removing it again restores the subscription path.
          if [ -n "$APIKEY_CLEAN" ]; then
            if [ -n "$OAUTH_CLEAN" ]; then
              echo "::notice::Both credentials set - using ANTHROPIC_API_KEY."
            fi
            OAUTH_CLEAN=""
          fi
          {
            echo "OAUTH_CLEAN=$OAUTH_CLEAN"
            echo "APIKEY_CLEAN=$APIKEY_CLEAN"
          } >> "$GITHUB_ENV"

      - name: Respond to Shep
        if: steps.query.outputs.reply == 'true' && (env.OAUTH_CLEAN != '' || env.APIKEY_CLEAN != '')
        uses: anthropics/claude-code-action@v1
        env:
          COACH_MODES: ${{ steps.query.outputs.modes }}
        with:
          claude_code_oauth_token: ${{ env.OAUTH_CLEAN }}
          anthropic_api_key: ${{ env.APIKEY_CLEAN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Shep has submitted the form. Read CLAUDE.md first, then work
            out WHICH of the two things is waiting - both may be:

            (A) A QUESTION. weekly_review_latest.json has an
                athlete_response with athlete_response_status "logged".
            (B) AN AMEND REQUEST. plan_proposal.json has status
                "amend_requested" - his response is on the proposal
                itself, in its athlete_response.

            Read the brief, weekly_review_latest.json (earlier exchanges
            this week are in conversation - read them, this is one
            continuing thread and he should never have to repeat
            himself), plan_proposal.json, the review it refers to in
            reviews/, plus weekly_summary.json, computed_data.json,
            manual_log.json (every session note), training_plan.json and
            race_prediction.json.

            FOR (A), follow "Answering him" in CLAUDE.md. Answer
            directly and honestly: what he said, whether the evidence
            supports it, and what happens as a result. If it changes
            nothing, say so and say why - agreeing to keep him happy is
            a failure, not a courtesy. Whenever you push back, give the
            evidence you are pushing back with. If it does change the
            read, write plan_proposal.json (status "pending", id =
            today's date). Then write the reply into
            weekly_review_latest.json as "coach_reply" (markdown, a few
            short paragraphs) with "coach_reply_at" (ISO timestamp) and
            set "athlete_response_status" to "answered".

            FOR (B), follow step 2 of the weekly review procedure: read
            his thoughts in the proposal's athlete_response, revise the
            changes accordingly, keep the SAME id, and set status back
            to "pending" so it returns to him for approval. Rewrite the
            rationale to open by saying what you changed and why - that
            text is what he reads on the dashboard, so it is his
            acknowledgement that the amend landed. If part of what he
            said does not change the plan, say that plainly there too,
            with the evidence. Also set "proposal_status" to "pending"
            in weekly_review_latest.json. Do NOT set
            athlete_response_status for an amend - that field belongs to
            the question thread.

            Note his amends often carry a scheduling constraint for the
            days immediately ahead ("I can't run Sunday"). Act on it
            now; that is the whole reason this runs on submit rather
            than waiting for Sunday.

            Do NOT edit training_plan.json - only apply_review.py may,
            and only after he approves. Do NOT commit or push, the
            workflow commits afterwards.
          claude_args: |
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(python3:*)"
            --max-turns 30

      # The action hides the SDK output "for security", so a failure
      # inside Claude arrives as a bare `is_error: true` — no way to
      # tell an expired token from a usage limit from an overloaded
      # model, which is the difference between "retry" and "fix it".
      # The execution log holds the actual message; print only that.
      - name: Why the reply failed
        if: failure()
        run: |
          python3 - <<'PY'
          import json, os
          path = os.path.join(os.environ["RUNNER_TEMP"], "claude-execution-output.json")
          try:
              with open(path) as f:
                  entries = json.load(f)
          except Exception as exc:
              print(f"No execution log to read ({type(exc).__name__}: {exc})")
              raise SystemExit
          if isinstance(entries, dict):
              entries = [entries]
          for e in entries:
              if isinstance(e, dict) and e.get("type") == "result":
                  print(f"subtype={e.get('subtype')} is_error={e.get('is_error')}")
                  print(e.get("result") or e.get("error") or "(no message on the result)")
          PY

      - name: Commit and push the reply
        if: steps.query.outputs.reply == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.json'
          if git diff --cached --quiet; then
            echo "No reply written."
          else
            MSG="Coach reply to review query"
            case "${{ steps.query.outputs.modes }}" in
              *amend*query*|*query*amend*) MSG="Coach reply and revised proposal" ;;
              *amend*) MSG="Revised proposal after amend request" ;;
            esac
            git commit -m "$MSG $(TZ=Europe/London date +%F)"
            git pull --rebase origin main
            git push origin main
          fi
