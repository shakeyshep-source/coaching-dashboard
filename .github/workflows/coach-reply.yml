# Coach reply — answers a query against a review that proposed nothing.
#
# A "hold" review has no proposal to approve, so a response to it can't
# go through the approve/amend/reject gate. apply_review.py logs it to
# weekly_review_latest.json with athlete_response_status="logged"; this
# workflow replies to it and flips the flag to "answered", so it runs
# once per query rather than on every pipeline run.
#
# Called by both pipelines (review-response.yml on form submit,
# daily-pull.yml on the morning schedule) rather than duplicated in
# each, so there is one definition of what a reply does.

name: Coach reply

on:
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write   # claude-code-action wants it available even when github_token is supplied

jobs:
  reply:
    runs-on: ubuntu-latest
    steps:
      # main, not the calling run's SHA — the caller has usually just
      # pushed the logged response we are about to answer.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Is a review query waiting for a reply?
        id: query
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          try:
              latest = json.load(open("weekly_review_latest.json"))
          except Exception:
              latest = {}
          waiting = bool(latest.get("athlete_response")) and \
              latest.get("athlete_response_status") == "logged"
          print(f"reply={'true' if waiting else 'false'}")
          PY
          cat "$GITHUB_OUTPUT"

      - name: Normalise the Claude credential
        if: steps.query.outputs.reply == 'true'
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          APIKEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          OAUTH_CLEAN="$(printf '%s' "$OAUTH" | tr -d '[:space:]')"
          APIKEY_CLEAN="$(printf '%s' "$APIKEY" | tr -d '[:space:]')"
          if [ -n "$OAUTH_CLEAN" ]; then echo "::add-mask::$OAUTH_CLEAN"; fi
          if [ -n "$APIKEY_CLEAN" ]; then echo "::add-mask::$APIKEY_CLEAN"; fi
          if [ -z "$OAUTH_CLEAN" ] && [ -z "$APIKEY_CLEAN" ]; then
            echo "::warning::No Claude credential set - the review query stays logged for Sunday's session."
          fi
          {
            echo "OAUTH_CLEAN=$OAUTH_CLEAN"
            echo "APIKEY_CLEAN=$APIKEY_CLEAN"
          } >> "$GITHUB_ENV"

      - name: Reply to the review query
        if: steps.query.outputs.reply == 'true' && (env.OAUTH_CLEAN != '' || env.APIKEY_CLEAN != '')
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ env.OAUTH_CLEAN }}
          anthropic_api_key: ${{ env.APIKEY_CLEAN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Shep has queried the latest weekly review. Follow the
            "Answering a review query" section of CLAUDE.md exactly.
            Read the brief, weekly_review_latest.json (his words are in
            athlete_response), the review it refers to in reviews/, plus
            weekly_summary.json, computed_data.json, manual_log.json
            (every session note), training_plan.json and
            race_prediction.json.

            Answer him directly and honestly: what he said, whether the
            evidence supports it, and what you are doing about it. If it
            changes nothing, say so and say why - agreeing to keep him
            happy is a failure, not a courtesy. Whenever you push back,
            give the evidence you are pushing back with. If it does
            change the read, write plan_proposal.json (status "pending",
            id = today's date) so it still goes through his approval.

            Write the reply into weekly_review_latest.json as
            "coach_reply" (markdown, a few short paragraphs) with
            "coach_reply_at" (ISO timestamp) and set
            "athlete_response_status" to "answered".

            Do NOT edit training_plan.json. Do NOT commit or push - the
            workflow commits afterwards.
          claude_args: |
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(python3:*)"
            --max-turns 30

      - name: Commit and push the reply
        if: steps.query.outputs.reply == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.json'
          if git diff --cached --quiet; then
            echo "No reply written."
          else
            git commit -m "Coach reply to review query $(TZ=Europe/London date +%F)"
            git pull --rebase origin main
            git push origin main
          fi
