# Weekly coach review — a scheduled Claude session acting as the
# endurance coach defined in CLAUDE.md.
#
# Every Sunday evening it reads the week's data + the athlete's notes,
# writes the review (reviews/YYYY-MM-DD.md + weekly_review_latest.json)
# and, if changes are warranted, a plan_proposal.json. It NEVER edits
# training_plan.json — apply_review.py does that, and only after an
# explicit "approve" via the weekly review form.
#
# Required repo secret (one of):
#   CLAUDE_CODE_OAUTH_TOKEN — from `claude setup-token` on the laptop
#                             (uses the existing Claude subscription), or
#   ANTHROPIC_API_KEY       — a pay-as-you-go API key.
# See AUTOMATION_SETUP.md step 3.

name: Weekly coach review

# Two Sunday slots. The API can fail transiently - the 9 Aug run died
# in 536ms on an api_error and the identical re-run succeeded minutes
# later with no code change. A second attempt costs nothing (it skips
# immediately if the review already exists) and means one blip no longer
# costs a week's review.
#
# Early afternoon rather than the evening: Shep's Sunday long run is a
# morning run, so the week is finished by lunchtime and a review that
# waits until 18:40 is just a review he reads late. It refreshes its own
# data first (see below), so the time is no longer tied to when the
# daily pull happens to have run.
on:
  schedule:
    - cron: '40 12 * * 0'  # Sunday ~13:40 UK in summer
    - cron: '40 15 * * 0'  # backstop ~16:40 UK, only runs if the first produced nothing
  workflow_dispatch: {}     # run on demand from the Actions tab

permissions:
  contents: write
  id-token: write   # claude-code-action exchanges an OIDC token for its GitHub token

# Shared with the daily pull and the form fast lane: this workflow now
# pushes data commits of its own, so it must never run alongside them.
# The two Sunday slots stay serialised against each other too.
concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Europe/London, per the brief - never UTC for day boundaries.
      - name: Has today's review already been written?
        id: check
        run: |
          TODAY=$(TZ=Europe/London date +%F)
          if [ -f "reviews/$TODAY.md" ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
            echo "Review for $TODAY already exists - nothing to do."
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
            echo "No review for $TODAY yet - running the coach session."
          fi

      # The review used to read whatever the last daily pull left on
      # disk, which tied it to the cron timetable: run it before the
      # 10:30 pull and the Sunday long run — the biggest session of the
      # week — would be missing from the week it is reviewing. Pulling
      # here instead means the review is always looking at the finished
      # week, whatever time it fires.
      - uses: actions/setup-python@v5
        if: steps.check.outputs.done == 'false'
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.check.outputs.done == 'false'
        run: pip install -r requirements.txt

      - name: Restore Garmin tokens
        if: steps.check.outputs.done == 'false'
        env:
          GARMIN_TOKENS_B64: ${{ secrets.GARMIN_TOKENS_B64 }}
        run: |
          if [ -z "$GARMIN_TOKENS_B64" ]; then
            echo "::warning::GARMIN_TOKENS_B64 secret not set - the review will read the last pulled data"
          else
            echo "$GARMIN_TOKENS_B64" | base64 -d | tar -xz -C "$HOME"
            echo "Tokens restored to $HOME/.garmin_tokens"
          fi

      - name: Refresh the data the review reads
        if: steps.check.outputs.done == 'false'
        # Never fatal. A failed Garmin pull should cost the review some
        # freshness, not the review itself — run_all.py still rebuilds
        # the derived layer from whatever is on disk.
        env:
          GARMIN_TOKENSTORE: /home/runner/.garmin_tokens
        run: |
          python run_all.py || echo "::warning::One or more pipeline steps failed - the review runs on the data that did build"

      - name: Commit and push refreshed data
        if: steps.check.outputs.done == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.json'
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Pre-review data pull $(TZ=Europe/London date +'%F %H:%M')"
            git pull --rebase origin main
            git push origin main
          fi

      # A token copied from a terminal very often carries a trailing
      # newline, or a line break where the terminal wrapped it on screen.
      # GitHub stores that whitespace verbatim and the API then rejects
      # the Authorization header as invalid, with no usable error. These
      # tokens never legitimately contain whitespace, so strip it here,
      # re-mask the cleaned value and hand that to the action. Reports
      # lengths and shape only, never the value.
      - name: Preflight — normalise and check the Claude credential
        if: steps.check.outputs.done == 'false'
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          APIKEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          OAUTH_CLEAN="$(printf '%s' "$OAUTH" | tr -d '[:space:]')"
          APIKEY_CLEAN="$(printf '%s' "$APIKEY" | tr -d '[:space:]')"
          if [ -n "$OAUTH_CLEAN" ]; then echo "::add-mask::$OAUTH_CLEAN"; fi
          if [ -n "$APIKEY_CLEAN" ]; then echo "::add-mask::$APIKEY_CLEAN"; fi

          if [ -n "$OAUTH_CLEAN" ]; then
            NAME=CLAUDE_CODE_OAUTH_TOKEN; VAL="$OAUTH_CLEAN"; RAW="$OAUTH"; PREFIX=sk-ant-oat
          elif [ -n "$APIKEY_CLEAN" ]; then
            NAME=ANTHROPIC_API_KEY; VAL="$APIKEY_CLEAN"; RAW="$APIKEY"; PREFIX=sk-ant-api
          else
            echo "::error::No Claude credential set. Run 'claude setup-token' on the laptop and save it as CLAUDE_CODE_OAUTH_TOKEN under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          STRIPPED=$(( ${#RAW} - ${#VAL} ))
          if [ "$STRIPPED" -gt 0 ]; then
            echo "::notice::$NAME contained $STRIPPED whitespace character(s) from the copy-paste - stripped automatically."
          fi
          echo "$NAME: ${#VAL} characters after cleaning"

          if [ "${VAL#$PREFIX}" = "$VAL" ]; then
            echo "::error::$NAME does not begin with '$PREFIX', so the wrong value was probably pasted. Re-run 'claude setup-token' and copy only the token it prints."
            exit 1
          fi

          {
            echo "OAUTH_CLEAN=$OAUTH_CLEAN"
            echo "APIKEY_CLEAN=$APIKEY_CLEAN"
          } >> "$GITHUB_ENV"
          echo "$NAME is present and usable."

      - name: Run coach session
        if: steps.check.outputs.done == 'false'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ env.OAUTH_CLEAN }}
          anthropic_api_key: ${{ env.APIKEY_CLEAN }}
          # Supplied explicitly so the action never needs the OIDC
          # exchange — this session only touches local files, the
          # workflow's own final step does the committing.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Follow the "Weekly review procedure" in CLAUDE.md exactly.
            Today is the review date. Read the brief and all the data
            files it lists (weekly_summary.json, computed_data.json,
            manual_log.json including every session note,
            training_plan.json, plan_proposal.json, review_responses.json,
            race_prediction.json, weekly_review_latest.json), then:
            - if the existing proposal is amend_requested, revise it per
              the athlete's thoughts and refresh the review files;
            - if weekly_review_latest.json carries an athlete_response
              (a query against a review that proposed nothing), answer it
              at the top of this week's review, per step 2b of the brief;
            - otherwise write this week's review to reviews/<today>.md,
              update weekly_review_latest.json, and write
              plan_proposal.json only if you are recommending changes.
            Do NOT edit training_plan.json. Do NOT commit or push — the
            workflow commits your files afterwards.
          claude_args: |
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git log:*),Bash(git diff:*),Bash(python3:*)"
            --max-turns 50

      # The action hides Claude's output, so a failure arrives as a bare
      # "is_error:true" with no cause — which cost a long diagnostic
      # detour once already. The SDK writes its transcript to a temp
      # file; surface just the result line so every future failure
      # states its own reason, without dumping the whole conversation.
      - name: Explain a failed coach session
        if: failure() && steps.check.outputs.done == 'false'
        run: |
          F="$RUNNER_TEMP/claude-execution-output.json"
          if [ ! -f "$F" ]; then
            echo "::warning::no execution transcript at $F"
            exit 0
          fi
          python3 - "$F" <<'PY'
          import json, sys
          try:
              data = json.load(open(sys.argv[1]))
          except Exception as exc:
              print(f"::warning::could not parse execution transcript: {exc}")
              raise SystemExit(0)
          for row in (data if isinstance(data, list) else [data]):
              if isinstance(row, dict) and row.get("type") == "result":
                  print(f"::error::Coach session failed: {row.get('result')}")
                  print(f"::error::terminal_reason={row.get('terminal_reason')} "
                        f"api_error_status={row.get('api_error_status')} "
                        f"turns={row.get('num_turns')}")
          PY

      - name: Commit and push review
        if: steps.check.outputs.done == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reviews/ weekly_review_latest.json plan_proposal.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No review output to commit."
          else
            git commit -m "Weekly coach review $(date -u +%F)"
            git pull --rebase origin main
            git push origin main
          fi
